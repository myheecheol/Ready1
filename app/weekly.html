<title>주간학습 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
/* 레이아웃: 회청색 책상 위에 한글 문서 한 장(종이)을 올려두고, 위쪽 도구줄에서 주 이동·편집을 하는 구조 */
:root {
  /* 앱 화면(테마 따라 바뀜) */
  --desk: #e9edf1;
  --surface: #ffffff;
  --ink: #1d2733;
  --muted: #5d6b7a;
  --line: #cfd7df;
  --accent: #1f4e79;
  --accent-soft: #dde8f3;
  --danger: #b3261e;
  /* 종이(문서) — 한글 문서처럼 항상 흰 종이에 검은 글씨 */
  --paper: #ffffff;
  --paper-ink: #111111;
  --paper-rule: #1a1a1a;
  --paper-head: #bfe3ee;
  --paper-na: #eeeeee;
  --paper-hol: #e3e3e3;
  --paper-red: #c62828;
  --paper-today: #fff6d6;
  --paper-faint: #9aa3ad;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-doc: "Nanum Gothic", "나눔고딕", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #14191f; --surface: #1d242c; --ink: #e5e9ee; --muted: #9aa7b4;
    --line: #34404c; --accent: #8cbbe8; --accent-soft: #243646; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #14191f; --surface: #1d242c; --ink: #e5e9ee; --muted: #9aa7b4;
  --line: #34404c; --accent: #8cbbe8; --accent-soft: #243646; --danger: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 14px/1.5 var(--font-ui); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── 도구줄 ── */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1120px; margin: 0 auto; padding: 8px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.brand { font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.brand svg { flex: none; }
.tabs { display: flex; gap: 2px; background: var(--desk); border-radius: 999px; padding: 3px; }
.tab { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; color: var(--muted); font-weight: 500; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.sync { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.cloud::before { background: #2e9d5b; }
.sync.err::before { background: var(--danger); }

.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; display: grid; gap: 14px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .grow { flex: 1 1 auto; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: var(--radius); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { color: var(--danger); }
.btn.icon { padding: 6px 10px; }
.btn:disabled { opacity: .45; cursor: default; }
.field { border: 1px solid var(--line); background: var(--surface); padding: 6px 10px; border-radius: var(--radius); min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }

/* ── 종이(문서) ── */
.sheet { background: var(--paper); color: var(--paper-ink); font-family: var(--font-doc); border-radius: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.06); padding: 22px 22px 26px; }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; margin-bottom: 14px; gap: 8px; }
.sheet-head h1 { grid-column: 2; margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; text-align: center; text-wrap: balance; }
.sheet-head .wk { grid-column: 3; justify-self: end; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.sheet-head .wk small { font-size: 12px; font-weight: 700; }
.grid-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.plan { width: 100%; min-width: 860px; border-collapse: collapse; table-layout: fixed; border: 2px solid var(--paper-rule); }
table.plan th, table.plan td { border: 1px solid var(--paper-rule); padding: 0; vertical-align: middle; text-align: center; }
table.plan thead th { background: var(--paper-head); font-size: 14px; font-weight: 800; height: 26px; }
table.plan col.c-date { width: 46px; } table.plan col.c-lab { width: 30px; } table.plan col.c-todo { width: 96px; }
table.plan tbody.day { border-top: 2px solid var(--paper-rule); }
table.plan .lab { background: var(--paper-head); font-size: 11px; font-weight: 700; line-height: 1.25; padding: 2px 0; }
table.plan .r-subj td, table.plan .r-subj th { height: 28px; }
table.plan .r-topic td { height: 50px; }
table.plan .r-note td, table.plan .r-note th { height: 20px; }
table.plan .date { font-size: 11.5px; font-weight: 700; line-height: 1.35; font-variant-numeric: tabular-nums; }
table.plan .date .hn { display: block; color: var(--paper-red); font-size: 9.5px; font-weight: 700; line-height: 1.2; padding: 0 2px; overflow-wrap: anywhere; }
table.plan tbody.today .date { background: var(--paper-today); }
table.plan tbody.hol .date { color: var(--paper-red); }
td.subj { font-size: 15px; font-weight: 700; cursor: pointer; position: relative; }
td.subj:hover { box-shadow: inset 0 0 0 2px var(--accent); }
td.subj .alt { font-size: 10px; font-weight: 700; display: block; line-height: 1.1; opacity: .75; }
td.subj.empty::after { content: "+"; color: var(--paper-faint); font-weight: 400; }
td.na { background: var(--paper-na) repeating-linear-gradient(135deg, transparent 0 6px, rgba(0,0,0,.05) 6px 7px); }
td.hol { background: var(--paper-hol); color: #444; font-size: 13px; font-weight: 700; }
td.hol .hbtn { margin-left: 8px; font: 11px var(--font-ui); border: 1px solid #999; background: #fff; color: #333; border-radius: 4px; padding: 1px 6px; }
.ed { display: block; width: 100%; min-height: 100%; padding: 3px 4px; outline: none; font-size: 11.5px; line-height: 1.35; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.ed:focus { background: #fffbe8; box-shadow: inset 0 0 0 2px #e0b200; }
.ed:empty::before { content: attr(data-ph); color: #c3c8ce; }
.r-note .ed { font-size: 10.5px; padding: 1px 4px; }
td.todo .ed { font-size: 11.5px; min-height: 96px; display: flex; align-items: center; justify-content: center; text-align: center; }
td.todo .ed:empty { display: flex; }
.boxed { margin: 4px 6px; border: 1.5px solid #3b4a5a; background: #e3eef6; padding: 4px; min-height: 36px; display: flex; align-items: center; justify-content: center; }
.boxed .ed { padding: 0; text-align: center; }
td.subj.boxed-top { box-shadow: inset 0 0 0 2px #3b4a5a; }

/* 하단: 학생 명단 + MEMO */
.bottom { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 14px; margin-top: 18px; align-items: start; }
table.roster { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
table.roster th, table.roster td { border: 1px solid var(--paper-rule); height: 24px; text-align: center; padding: 0 2px; }
table.roster thead th { font-weight: 700; font-size: 11.5px; background: #f6f6f6; }
table.roster col.c-no { width: 30px; } table.roster col.c-name { width: 76px; }
table.roster td.no { font-variant-numeric: tabular-nums; }
table.roster button.chk { width: 100%; height: 100%; min-height: 23px; border: 0; background: transparent; font: 700 14px var(--font-doc); color: #1a7f3c; }
table.roster button.chk:hover { background: #f1f7f2; }
.memo { border: 1px solid var(--paper-rule); display: flex; flex-direction: column; min-height: 100%; }
.memo-h { text-align: center; font-weight: 800; font-family: "Times New Roman", var(--font-doc); letter-spacing: .06em; border-bottom: 1px solid var(--paper-rule); padding: 3px 0; font-size: 14px; }
.memo .ed { flex: 1; font-size: 13px; padding: 8px 10px; line-height: 1.6; min-height: 200px; }

/* ── 휴대폰 카드 보기 ── */
.daytabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 10px; }
.daytab { border: 1px solid var(--paper-rule); background: var(--paper); padding: 6px 0; border-radius: 6px; font: 700 13px var(--font-doc); color: var(--paper-ink); line-height: 1.25; }
.daytab small { display: block; font-weight: 400; font-size: 11px; font-variant-numeric: tabular-nums; }
.daytab[aria-selected="true"] { background: var(--paper-head); box-shadow: inset 0 0 0 2px var(--paper-rule); }
.daytab.hol small { color: var(--paper-red); }
.daytab.today { outline: 2px solid #e0b200; outline-offset: -2px; }
.cards { display: grid; gap: 6px; }
.pcard { display: grid; grid-template-columns: 52px 76px minmax(0, 1fr); border: 1px solid var(--paper-rule); border-radius: 6px; overflow: hidden; }
.pcard .pn { background: var(--paper-head); font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.2; border-right: 1px solid var(--paper-rule); }
.pcard .ps { font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; border: 0; border-right: 1px solid var(--paper-rule); font-family: var(--font-doc); color: #111; padding: 4px; text-align: center; line-height: 1.2; }
.pcard .pt { display: grid; min-width: 0; }
.pcard .pt .ed { font-size: 13px; min-height: 30px; }
.pcard .pt .ed.note { font-size: 11.5px; color: #555; border-top: 1px dashed #ccc; min-height: 22px; }
.pcard.na { opacity: .5; }
.todo-card { border: 1px solid var(--paper-rule); border-radius: 6px; }
.todo-card .h { background: var(--paper-head); font-weight: 800; font-size: 12px; padding: 3px 8px; border-bottom: 1px solid var(--paper-rule); border-radius: 6px 6px 0 0; }
.todo-card .ed { font-size: 13px; min-height: 40px; padding: 6px 8px; }
.holcard { border: 1px solid var(--paper-rule); border-radius: 6px; background: var(--paper-hol); padding: 22px 12px; text-align: center; font-weight: 800; color: var(--paper-red); display: grid; gap: 8px; justify-items: center; }
.holcard .hbtn { font: 12px var(--font-ui); border: 1px solid #999; background: #fff; color: #333; border-radius: 4px; padding: 3px 10px; }
.vac-banner { border: 1px dashed var(--paper-rule); padding: 10px; text-align: center; margin-bottom: 10px; font-weight: 700; color: var(--paper-red); }

/* ── 패널(과목·템플릿·설정) ── */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.panel h2 { margin: 0; font-size: 16px; font-weight: 600; }
.panel h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.rows { display: grid; gap: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row > .field.grow { flex: 1 1 140px; }
.subj-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px; border: 1px solid var(--line); border-radius: var(--radius); }
.subj-row .chip { width: 64px; }
.chip { display: inline-flex; align-items: center; justify-content: center; min-height: 30px; padding: 2px 10px; border-radius: 6px; font: 700 14px var(--font-doc); border: 1px solid rgba(0,0,0,.25); color: #111; }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
input[type="color"] { width: 34px; height: 28px; border: 1px solid var(--line); border-radius: 6px; padding: 1px; background: var(--surface); }
.grid2 { display: grid; align-items: start; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.tpl-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tpl-pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; }
.tpl-pill[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tpl-pill .star { color: #d19a00; }
textarea.field { width: 100%; min-height: 160px; resize: vertical; line-height: 1.6; }
.holi-list { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); font-size: 12.5px; }
.holi-list div { display: flex; justify-content: space-between; gap: 8px; padding: 4px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.holi-list div:last-child { border-bottom: 0; }

/* ── 모달 ── */
.scrim { position: fixed; inset: 0; background: rgba(10,16,22,.45); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.dialog { background: var(--surface); color: var(--ink); border-radius: 14px; width: min(460px, 100%); max-height: calc(100% - 32px); overflow: auto; padding: 18px; display: grid; gap: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
.dialog h2 { margin: 0; font-size: 16px; font-weight: 600; }
.dialog .acts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.pick .chip { width: 100%; cursor: pointer; }
.pick .chip[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 1px; }
.pick .chip.none { background: var(--surface); color: var(--muted); border-style: dashed; font-family: var(--font-ui); font-weight: 500; }
@media (max-width: 560px) {
  .scrim { align-items: flex-end; padding: 0; }
  .dialog { border-radius: 14px 14px 0 0; width: 100%; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
}
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 8px 16px; border-radius: 999px; z-index: 60; font-size: 13px; }

@media (max-width: 760px) {
  .sheet { padding: 14px 12px 18px; }
  .sheet-head { grid-template-columns: 1fr; justify-items: center; }
  .sheet-head h1 { grid-column: 1; font-size: 18px; }
  .sheet-head .wk { grid-column: 1; justify-self: center; }
  .bottom { grid-template-columns: minmax(0, 1fr); }
  .brand span { display: none; }
  .sync { font-size: 11px; }
}
@media (prefers-reduced-motion: no-preference) {
  .tab, .btn, .daytab { transition: background-color .15s, border-color .15s; }
}
@media print {
  @page { size: A4 portrait; margin: 9mm; }
  body { background: #fff; }
  .topbar, .toolbar, .no-print, .toast, .scrim { display: none !important; }
  .wrap { padding: 0; max-width: none; }
  .sheet { box-shadow: none; padding: 0; }
  .ed:empty::before, td.subj.empty::after { content: ""; }
  table.plan { min-width: 0; }
  .memo .ed { min-height: 0; }
  .grid-wrap { overflow: visible; }
}
</style>

const LS_KEY = "weekly-plan-v1";
const UI_KEY = "weekly-plan-ui";
let state;
try { state = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch { state = null; }
if (!state || !state.settings || !Array.isArray(state.templates)) state = defaultState();

const ui = { tab: "week", ws: null, day: null, view: "auto", tplId: null };
try { Object.assign(ui, JSON.parse(localStorage.getItem(UI_KEY) || "{}"), { ws: null, day: null }); } catch {}
const saveUI = () => { try { localStorage.setItem(UI_KEY, JSON.stringify({ tab: ui.tab, view: ui.view, tplId: ui.tplId })); } catch {} };

let DB = null, DL = null;
const dirty = new Set();
let flushTimer = null, flushing = false;
const syncEl = document.getElementById("sync");
function setSync(text, cls) { syncEl.textContent = text; syncEl.className = "sync " + (cls || ""); }

function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch {} }
function persist(keys) {
  keys.forEach(k => dirty.add(k));
  saveLocal();
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 700);
}
const configDoc = () => ({ v: 1, settings: state.settings, subjects: state.subjects, templates: state.templates });
async function flush() {
  if (!DB) { dirty.clear(); return; }
  if (flushing) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 500); return; }
  flushing = true;
  setSync("저장 중…", "cloud");
  const keys = [...dirty]; dirty.clear();
  try {
    for (const k of keys) {
      if (k === "config") await DB.col.doc("config").set(JSON.parse(JSON.stringify(configDoc())));
      else {
        const ws = k.slice(2), w = state.weeks[ws], ref = DB.col.doc("w-" + ws);
        if (w) await ref.set(JSON.parse(JSON.stringify(w))); else await ref.delete();
      }
    }
    setSync("계정에 저장됨", "cloud");
  } catch (e) {
    keys.forEach(k => dirty.add(k));
    setSync("저장 실패 · 이 기기에만 저장됨", "err");
    if (e && e.code === "unavailable") { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 3000 + Math.random() * 2000); }
  } finally { flushing = false; }
}

async function connectCloud() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    window.claude.use("downloads").then(d => { DL = d; }).catch(() => {});
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const col = db.collection("data/users/" + id);
    const snap = await col.limit(1000).get();
    DB = { col };
    if (snap.empty) {
      dirty.add("config");
      Object.keys(state.weeks).forEach(k => dirty.add("w:" + k));
    } else {
      const remoteWeeks = new Set();
      for (const d of snap.docs) {
        const data = d.data();
        if (d.id === "config" && data && data.settings) {
          state.settings = data.settings; state.subjects = data.subjects; state.templates = data.templates;
        } else if (d.id.startsWith("w-") && data) {
          const ws = d.id.slice(2); state.weeks[ws] = data; remoteWeeks.add(ws);
        }
      }
      Object.keys(state.weeks).forEach(k => { if (!remoteWeeks.has(k)) dirty.add("w:" + k); });
    }
    saveLocal();
    setSync("계정에 저장됨", "cloud");
    render();
    if (dirty.size) flush();
  } catch { setSync("이 기기에 저장", ""); }
}

/* ───────── 되돌리기 ───────── */
const undoStack = [];
function pushUndo() { undoStack.push(JSON.stringify(state)); if (undoStack.length > 40) undoStack.shift(); }
function undo() {
  const prev = undoStack.pop();
  if (!prev) { toast("되돌릴 작업이 없어요"); return; }
  const old = JSON.parse(prev);
  const keys = ["config"];
  const all = new Set([...Object.keys(old.weeks), ...Object.keys(state.weeks)]);
  all.forEach(k => { if (JSON.stringify(old.weeks[k]) !== JSON.stringify(state.weeks[k])) keys.push("w:" + k); });
  state = old;
  persist(keys);
  render();
  toast("되돌렸어요");
}
function mutate(fn, keys) { pushUndo(); fn(); persist(keys); render(); }

/* ───────── 도움 함수 ───────── */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const subj = id => state.subjects.find(s => s.id === id);
const tplById = id => state.templates.find(t => t.id === id);
const defaultTpl = () => tplById(state.settings.defaultTemplateId) || state.templates[0];
function textColor(hex) {
  const h = (hex || "#ffffff").replace("#", "");
  const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.3 ? "#111111" : "#ffffff";
}
const chipStyle = color => `background:${esc(color)};color:${textColor(color)}`;
const clone = o => JSON.parse(JSON.stringify(o));

function holidayOn(dateStr) {
  const custom = state.settings.holidays.find(h => h.start <= dateStr && dateStr <= (h.end || h.start));
  if (custom) return { name: custom.name, vacation: !!custom.vacation };
  if (KR_HOLIDAYS[dateStr] && !state.settings.hiddenBuiltins.includes(dateStr)) return { name: KR_HOLIDAYS[dateStr], vacation: false };
  return null;
}
const isVacationWeek = ws => DAYS.every((_, i) => { const h = holidayOn(ymd(addDays(ws, i))); return h && h.vacation; });

function weekInfo(ws) {
  for (const sem of state.settings.semesters) {
    if (!sem.start || !sem.end) continue;
    const s = mondayOf(parse(sem.start)), e = parse(sem.end);
    if (ws < s || ws > e) continue;
    if (isVacationWeek(ws)) return { n: null, vacation: true, sem };
    let n = 0;
    for (let w = s; w <= ws; w = addDays(w, 7)) if (!isVacationWeek(w)) n++;
    return { n, vacation: false, sem };
  }
  return { n: null, vacation: isVacationWeek(ws), sem: null };
}

function blankDay() { return { count: 6, todo: "", cells: Array.from({ length: 6 }, () => ({ s: null, t: "", n: "", span: 1 })) }; }
function daysFromTemplate(tpl, weekNo) {
  const odd = weekNo != null && weekNo % 2 === 1;
  return (tpl ? tpl.days : DAYS.map(blankDay)).map(d => ({
    count: d.count, todo: d.todo || "",
    cells: d.cells.map(c => ({ s: odd && c.o ? c.o : c.s, t: c.t || "", n: c.n || "", span: c.span || 1, box: !!c.box }))
  }));
}
function virtualWeek(ws) {
  const tpl = defaultTpl();
  return { templateId: tpl ? tpl.id : null, days: daysFromTemplate(tpl, weekInfo(ws).n), checks: {}, memo: "", open: [false, false, false, false, false] };
}
const wsKey = () => ymd(ui.ws);
const curWeek = () => state.weeks[wsKey()] || virtualWeek(ui.ws);
function ensureWeek() { const k = wsKey(); if (!state.weeks[k]) state.weeks[k] = virtualWeek(ui.ws); return state.weeks[k]; }

/* 편집 대상: 주간학습 화면이면 이번 주, 템플릿 화면이면 선택한 템플릿 */
function ctx() {
  if (ui.tab === "tpl") { const t = tplById(ui.tplId) || defaultTpl(); return { mode: "tpl", days: t.days, get: () => t.days, key: "config", tpl: t }; }
  return { mode: "week", days: curWeek().days, get: () => ensureWeek().days, key: "w:" + wsKey() };
}

/* 칸 목록(병합 반영) */
function layoutCells(day) {
  const out = [];
  for (let i = 0; i < 6;) {
    if (i >= day.count) { out.push({ i, na: true, span: 1 }); i++; continue; }
    const c = day.cells[i] || { s: null, t: "", n: "", span: 1 };
    const span = Math.max(1, Math.min(c.span || 1, day.count - i));
    out.push({ i, c, span });
    i += span;
  }
  return out;
}

/* ───────── 모달 ───────── */
function openDialog(html, onMount) {
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(scrim);
  const close = () => { scrim.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", e => { if (e.target === scrim) close(); });
  const dlg = scrim.firstChild;
  onMount && onMount(dlg, close);
  const f = dlg.querySelector("[autofocus], button, input, select");
  f && f.focus();
  return close;
}
function ask(title, body, okLabel = "확인", danger = false) {
  return new Promise(res => {
    openDialog(`<h2>${esc(title)}</h2>${body ? `<p class="hint" style="font-size:14px">${esc(body)}</p>` : ""}
      <div class="acts"><button class="btn" data-x="no">취소</button><button class="btn ${danger ? "danger" : "primary"}" data-x="ok" autofocus>${esc(okLabel)}</button></div>`,
      (dlg, close) => {
        let done = false;
        dlg.addEventListener("click", e => { const x = e.target.closest("[data-x]"); if (!x) return; done = true; close(); res(x.dataset.x === "ok"); });
        new MutationObserver((_, o) => { if (!dlg.isConnected) { o.disconnect(); if (!done) res(false); } }).observe(document.body, { childList: true });
      });
  });
}
let toastTimer;
function toast(msg) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 1800);
}

/* 과목 칸 편집 창 */
function openCellDialog(d, p) {
  const c0 = ctx();
  const day = c0.days[d], cell = day.cells[p] || {};
  const isTpl = c0.mode === "tpl";
  const span = Math.max(1, Math.min(cell.span || 1, day.count - p));
  const canMerge = p + span < day.count;
  const chips = sel => `<button class="chip none" data-pick="" aria-pressed="${!sel}">비우기</button>` +
    state.subjects.map(s => `<button class="chip" style="${chipStyle(s.color)}" data-pick="${s.id}" aria-pressed="${s.id === sel}">${esc(s.name)}</button>`).join("");
  const title = `${DAYS[d]}요일 ${span > 1 ? `${p + 1}–${p + span}` : p + 1}교시`;
  openDialog(`<h2>${title}</h2>
    <div class="rows"><h3>${isTpl ? "과목 (짝수 주·기본)" : "과목"}</h3><div class="pick" data-g="s">${chips(cell.s)}</div></div>
    ${isTpl ? `<div class="rows"><h3>홀수 주에는 다른 과목 (선택)</h3><select class="field" id="odd-pick"><option value="">같은 과목</option>${state.subjects.map(s => `<option value="${s.id}"${s.id === cell.o ? " selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div>` : ""}
    <div class="rows"><h3>칸 합치기</h3><div class="row">
      <button class="btn" data-x="merge" ${canMerge ? "" : "disabled"}>오른쪽 칸과 합치기</button>
      <button class="btn" data-x="split" ${span > 1 ? "" : "disabled"}>합친 칸 나누기</button>
      <label class="row" style="gap:4px"><input type="checkbox" id="box-pick" ${cell.box ? "checked" : ""}> 테두리 박스 강조</label></div></div>
    <div class="rows"><h3>${DAYS[d]}요일 교시 수</h3><div class="seg">${[4, 5, 6].map(n => `<button data-x="count" data-n="${n}" aria-pressed="${day.count === n}">${n}교시</button>`).join("")}</div></div>
    <div class="acts"><button class="btn primary" data-x="close">닫기</button></div>`,
    (dlg, close) => {
      const apply = fn => { pushUndo(); const days = c0.get(); fn(days[d], days[d].cells[p] || (days[d].cells[p] = { s: null, t: "", n: "", span: 1 })); persist([c0.key]); render(); };
      dlg.addEventListener("click", e => {
        const pk = e.target.closest("[data-pick]");
        if (pk) { apply((_, c) => { c.s = pk.dataset.pick || null; }); close(); return; }
        const x = e.target.closest("[data-x]"); if (!x || x.disabled) return;
        const a = x.dataset.x;
        if (a === "close") close();
        else if (a === "merge") { apply((dy, c) => { const nx = dy.cells[p + span] || {}; const add = Math.max(1, nx.span || 1); c.span = span + add; if (!c.t && nx.t) c.t = nx.t; if (!c.n && nx.n) c.n = nx.n; for (let j = p + span; j < p + span + add && j < 6; j++) dy.cells[j] = { s: null, t: "", n: "", span: 1 }; }); close(); }
        else if (a === "split") { apply((dy, c) => { for (let j = p + 1; j < p + span; j++) dy.cells[j] = { s: null, t: "", n: "", span: 1 }; c.span = 1; }); close(); }
        else if (a === "count") { apply(dy => { dy.count = Number(x.dataset.n); }); close(); }
      });
      const odd = dlg.querySelector("#odd-pick");
      odd && odd.addEventListener("change", () => apply((_, c) => { c.o = odd.value || null; }));
      dlg.querySelector("#box-pick").addEventListener("change", e => apply((_, c) => { c.box = e.target.checked; }));
    });
}

let editSnap = null, editPushed = false;
view.addEventListener("focusin", e => { if (e.target.matches(".ed")) { editSnap = JSON.stringify(state); editPushed = false; } });
view.addEventListener("paste", e => {
  if (!e.target.closest(".ed")) return;
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData("text/plain");
  document.execCommand("insertText", false, text);
});
view.addEventListener("input", e => {
  const el = e.target.closest(".ed");
  if (el) {
    if (!editPushed && editSnap) { undoStack.push(editSnap); if (undoStack.length > 40) undoStack.shift(); editPushed = true; }
    const val = el.innerText.replace(/\n$/, "");
    const k = el.dataset.k;
    if (k === "memo") { ensureWeek().memo = val; persist(["w:" + wsKey()]); return; }
    const c = ctx(), days = c.get(), d = Number(el.dataset.d);
    if (k === "todo") days[d].todo = val;
    else if (k === "cell") { const cell = days[d].cells[Number(el.dataset.p)]; cell[el.dataset.f] = val; }
    persist([c.key]);
    return;
  }
  const t = e.target;
  if (t.dataset.sf && t.dataset.sf === "name") { const s = subj(t.dataset.id); if (s) { s.name = t.value; persist(["config"]); const chip = t.closest(".subj-row").querySelector(".chip"); chip.textContent = t.value; } }
  if (t.dataset.sf === "color") { const s = subj(t.dataset.id); if (s) { s.color = t.value; persist(["config"]); const chip = t.closest(".subj-row").querySelector(".chip"); chip.style.cssText = chipStyle(t.value); } }
  if (t.id === "tpl-name") { const tp = tplById(ui.tplId); if (tp) { tp.name = t.value; persist(["config"]); view.querySelector(".sheet-head h1").textContent = t.value; } }
  if (t.id === "set-class") { state.settings.className = t.value; persist(["config"]); }
  if (t.dataset.set === "ct") { state.settings.checkTitles[Number(t.dataset.i)] = t.value; persist(["config"]); }
  if (t.dataset.set === "sem" && t.dataset.f === "name") { state.settings.semesters[Number(t.dataset.i)].name = t.value; persist(["config"]); }
  if (t.dataset.set === "hol" && t.dataset.f === "name") { state.settings.holidays[Number(t.dataset.i)].name = t.value; persist(["config"]); }
});

view.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "jump" && t.value) { ui.ws = mondayOf(parse(t.value)); ui.day = null; render(); return; }
  if (t.id === "week-tpl") {
    const tpl = tplById(t.value);
    const stored = state.weeks[wsKey()];
    if (stored && !(await ask("템플릿을 바꿀까요?", `이 주의 시간표를 '${tpl.name}'(으)로 다시 채워요. 체크와 메모는 그대로 남아요.`, "바꾸기"))) { render(); return; }
    mutate(() => { const w = ensureWeek(); w.templateId = tpl.id; w.days = daysFromTemplate(tpl, weekInfo(ui.ws).n); }, ["w:" + wsKey()]);
    return;
  }
  if (t.dataset.sf === "color" || t.dataset.sf === "name") { pushUndo(); render(); return; }
  if (t.id === "set-students") {
    mutate(() => {
      const old = [...state.settings.students];
      state.settings.students = t.value.split("\n").map(s => s.trim()).filter(Boolean).map(name => {
        const i = old.findIndex(p => p.name === name);
        return i >= 0 ? old.splice(i, 1)[0] : { id: "p_" + uid(), name };
      });
    }, ["config"]);
    toast("학생 명단을 저장했어요");
    return;
  }
  if (t.dataset.set === "sem" && t.dataset.f !== "name") { mutate(() => { state.settings.semesters[Number(t.dataset.i)][t.dataset.f] = t.value; }, ["config"]); return; }
  if (t.dataset.set === "hol" && t.dataset.f !== "name") {
    mutate(() => {
      const h = state.settings.holidays[Number(t.dataset.i)];
      if (t.dataset.f === "vacation") h.vacation = t.value === "1"; else h[t.dataset.f] = t.value;
      if (h.end && h.start && h.end < h.start) h.end = h.start;
    }, ["config"]);
    return;
  }
  if (t.dataset.act === "builtin") {
    mutate(() => { const hb = state.settings.hiddenBuiltins, d = t.dataset.d; const i = hb.indexOf(d); if (t.checked && i >= 0) hb.splice(i, 1); if (!t.checked && i < 0) hb.push(d); }, ["config"]);
    return;
  }
  if (t.id === "import-file" && t.files && t.files[0]) {
    const r = new FileReader();
    r.onload = () => importText(String(r.result));
    r.readAsText(t.files[0]);
  }
});

view.addEventListener("submit", e => {
  if (e.target.id !== "subj-add") return;
  e.preventDefault();
  const inp = document.getElementById("subj-new"); const name = inp.value.trim();
  if (!name) return;
  mutate(() => state.subjects.push({ id: "s_" + uid(), name, color: PRESETS[state.subjects.length % PRESETS.length] }), ["config"]);
  toast(`'${name}' 과목을 추가했어요`);
});

view.addEventListener("keydown", e => {
  const c = e.target.closest("td.subj");
  if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openCellDialog(Number(c.dataset.d), Number(c.dataset.p)); }
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !e.target.closest(".ed, input, textarea")) { e.preventDefault(); undo(); }
});

view.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, wk = "w:" + wsKey();
  switch (a) {
    case "prev": ui.ws = addDays(ui.ws, -7); ui.day = null; render(); break;
    case "next": ui.ws = addDays(ui.ws, 7); ui.day = null; render(); break;
    case "thisweek": ui.ws = null; ui.day = null; render(); break;
    case "day": ui.day = Number(b.dataset.d); render(); break;
    case "view-table": ui.view = isNarrow() ? "table" : "auto"; saveUI(); render(); break;
    case "view-cards": ui.view = "cards"; saveUI(); render(); break;
    case "undo": undo(); break;
    case "print": window.print(); break;
    case "cell": openCellDialog(Number(b.dataset.d), Number(b.dataset.p)); break;
    case "open-day": mutate(() => { const w = ensureWeek(); w.open = w.open || []; w.open[Number(b.dataset.d)] = true; }, [wk]); break;
    case "close-day": mutate(() => { const w = ensureWeek(); w.open[Number(b.dataset.d)] = false; }, [wk]); break;
    case "chk": mutate(() => { const w = ensureWeek(); w.checks = w.checks || {}; const arr = w.checks[b.dataset.id] || (w.checks[b.dataset.id] = [false, false, false]); arr[Number(b.dataset.j)] = !arr[Number(b.dataset.j)]; }, [wk]); break;
    case "copy-prev": {
      const pk = ymd(addDays(ui.ws, -7)), prev = state.weeks[pk] || virtualWeek(addDays(ui.ws, -7));
      if (state.weeks[wsKey()] && !(await ask("지난주 시간표를 복사할까요?", "이 주의 시간표·TO DO를 지난주 것으로 바꿔요. 체크와 메모는 그대로 남아요.", "복사하기"))) break;
      mutate(() => { const w = ensureWeek(); w.days = clone(prev.days); w.templateId = prev.templateId; }, [wk]);
      toast("지난주 시간표를 복사했어요"); break;
    }
    case "reset-tpl": {
      const w = curWeek(), tpl = tplById(w.templateId) || defaultTpl();
      if (!(await ask("템플릿으로 되돌릴까요?", `이 주에서 고친 시간표를 '${tpl.name}' 내용으로 되돌려요. 체크와 메모는 그대로 남아요.`, "되돌리기", true))) break;
      mutate(() => { const w2 = ensureWeek(); w2.templateId = tpl.id; w2.days = daysFromTemplate(tpl, weekInfo(ui.ws).n); }, [wk]); break;
    }
    case "save-as-tpl": saveAsTemplate(); break;
    case "tpl-pick": ui.tplId = b.dataset.id; saveUI(); render(); break;
    case "tpl-new": mutate(() => { const t = { id: "t_" + uid(), name: "새 템플릿", days: DAYS.map(blankDay) }; state.templates.push(t); ui.tplId = t.id; }, ["config"]); break;
    case "tpl-dup": mutate(() => { const src = tplById(ui.tplId); const t = { ...clone(src), id: "t_" + uid(), name: src.name + " 복사본" }; state.templates.push(t); ui.tplId = t.id; }, ["config"]); break;
    case "tpl-del": {
      const t = tplById(ui.tplId); if (!t || state.templates.length < 2) break;
      if (!(await ask(`'${t.name}' 템플릿을 삭제할까요?`, "이미 만든 주의 시간표는 그대로 남아요.", "삭제", true))) break;
      mutate(() => { state.templates = state.templates.filter(x => x.id !== t.id); if (state.settings.defaultTemplateId === t.id) state.settings.defaultTemplateId = state.templates[0].id; ui.tplId = state.templates[0].id; }, ["config"]); break;
    }
    case "tpl-default": mutate(() => { state.settings.defaultTemplateId = ui.tplId; }, ["config"]); toast("기본 템플릿으로 지정했어요"); break;
    case "subj-color": mutate(() => { subj(b.dataset.id).color = b.dataset.c; }, ["config"]); break;
    case "subj-up": case "subj-down": mutate(() => { const L = state.subjects, i = L.findIndex(s => s.id === b.dataset.id), j = a === "subj-up" ? i - 1 : i + 1; [L[i], L[j]] = [L[j], L[i]]; }, ["config"]); break;
    case "subj-del": {
      const s = subj(b.dataset.id);
      if (!(await ask(`'${s.name}' 과목을 삭제할까요?`, "이 과목이 들어 있던 칸은 빈칸이 돼요.", "삭제", true))) break;
      mutate(() => { state.subjects = state.subjects.filter(x => x.id !== s.id); }, ["config"]); break;
    }
    case "wkend": mutate(() => { state.settings.weekendNext = b.dataset.v === "1"; }, ["config"]); break;
    case "sem-add": mutate(() => state.settings.semesters.push({ name: "새 학기", start: "", end: "" }), ["config"]); break;
    case "sem-del": mutate(() => state.settings.semesters.splice(Number(b.dataset.i), 1), ["config"]); break;
    case "hol-add": { const t = ymd(todayKST()); mutate(() => state.settings.holidays.push({ name: "재량휴업일", start: t, end: t, vacation: false }), ["config"]); break; }
    case "hol-del": mutate(() => state.settings.holidays.splice(Number(b.dataset.i), 1), ["config"]); break;
    case "export": exportAll(); break;
    case "import-paste": importPasteDialog(); break;
    case "reset-all": {
      if (!(await ask("처음 상태로 초기화할까요?", "모든 주, 템플릿, 과목, 설정이 예시 상태로 돌아가요. 필요하면 먼저 내보내기로 백업하세요.", "초기화", true))) break;
      const oldWeeks = Object.keys(state.weeks);
      mutate(() => { state = defaultState(); }, ["config", ...oldWeeks.map(k => "w:" + k)]);
      toast("초기화했어요"); break;
    }
  }
});

function saveAsTemplate() {
  const w = curWeek(), info = weekInfo(ui.ws);
  const base = tplById(w.templateId) || defaultTpl();
  openDialog(`<h2>이 주를 템플릿으로 저장</h2>
    <label class="rows"><span class="hint">새 템플릿 이름</span><input class="field" id="nt-name" value="${esc((info.n ? info.n + "주 " : md(ui.ws) + " ") + "시간표")}" autofocus></label>
    <div class="acts"><button class="btn" data-x="over">'${esc(base.name)}'에 덮어쓰기</button><button class="btn primary" data-x="new">새 템플릿으로 저장</button></div>`,
    (dlg, close) => dlg.addEventListener("click", async e => {
      const x = e.target.closest("[data-x]"); if (!x) return;
      const days = clone(w.days).map(d => ({ ...d, cells: d.cells.map(c => ({ s: c.s, t: c.t, n: c.n, span: c.span || 1, box: !!c.box })) }));
      if (x.dataset.x === "new") {
        const name = dlg.querySelector("#nt-name").value.trim() || "새 템플릿";
        close(); mutate(() => state.templates.push({ id: "t_" + uid(), name, days }), ["config"]); toast(`'${name}' 템플릿을 만들었어요`);
      } else {
        close();
        if (!(await ask(`'${base.name}'에 덮어쓸까요?`, "홀수 주 과목 설정은 이 주에 보이는 과목으로 바뀌어요.", "덮어쓰기", true))) return;
        mutate(() => { base.days = days; }, ["config"]); toast("템플릿을 바꿨어요");
      }
    }));
}

function exportAll() {
  const data = JSON.stringify({ app: "weekly-plan", exportedAt: new Date().toISOString(), ...state }, null, 1);
  const name = `주간학습안내-백업-${ymd(todayKST())}.json`;
  if (DL) { DL.save({ filename: name, data }).then(() => toast("내보냈어요")).catch(err => { if (err && err.code !== "declined") showExportText(data); }); return; }
  if (!framed) {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast("파일로 내보냈어요"); return;
  }
  showExportText(data);
}
function showExportText(data) {
  openDialog(`<h2>백업 내용</h2><p class="hint">아래 내용을 복사해 메모장 등에 저장해 두세요. 가져올 때 그대로 붙여넣으면 돼요.</p>
    <textarea class="field" id="exp-text" readonly>${esc(data)}</textarea><div class="acts"><button class="btn primary" data-x="copy">복사</button></div>`,
    dlg => dlg.addEventListener("click", e => {
      if (!e.target.closest("[data-x=copy]")) return;
      const ta = dlg.querySelector("#exp-text");
      navigator.clipboard.writeText(data).then(() => toast("복사했어요")).catch(() => { ta.focus(); ta.select(); toast("선택했어요. 복사하세요"); });
    }));
}
function importPasteDialog() {
  openDialog(`<h2>붙여넣어 가져오기</h2><textarea class="field" id="imp-text" placeholder="내보낸 백업 내용을 붙여넣으세요" autofocus></textarea>
    <div class="acts"><button class="btn primary" data-x="go">가져오기</button></div>`,
    (dlg, close) => dlg.addEventListener("click", e => { if (e.target.closest("[data-x=go]")) { const v = dlg.querySelector("#imp-text").value; close(); importText(v); } }));
}
async function importText(text) {
  let data;
  try { data = JSON.parse(text); } catch { toast("백업 형식이 아니에요. 내보낸 파일 내용을 그대로 넣어 주세요"); return; }
  if (!data || !data.settings || !Array.isArray(data.templates) || !Array.isArray(data.subjects)) { toast("주간학습 안내 백업이 아니에요"); return; }
  if (!(await ask("백업을 가져올까요?", "지금 내용이 백업 내용으로 바뀌어요.", "가져오기", true))) return;
  const oldWeeks = Object.keys(state.weeks);
  mutate(() => { state = { v: 1, settings: data.settings, subjects: data.subjects, templates: data.templates, weeks: data.weeks || {} }; },
    ["config", ...new Set([...oldWeeks, ...Object.keys(data.weeks || {})].map(k => "w:" + k))]);
  toast("가져왔어요");
}

let lastNarrow = isNarrow();
window.addEventListener("resize", () => { const n = isNarrow(); if (n !== lastNarrow) { lastNarrow = n; if (!document.activeElement || !document.activeElement.closest(".ed")) render(); } });
window.addEventListener("beforeprint", () => { if (useCards()) { const v = ui.view; ui.view = "table"; render(); ui.view = v; } });
window.addEventListener("afterprint", () => render());

render();
connectCloud();
})();
</script>
