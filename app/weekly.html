<title>주간학습 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
/* 레이아웃: 회청색 책상 위에 둥근 모서리의 문서 한 장. 표는 가는 회색 칸선 + 요일 사이 진한 구분선, 머리행은 옅은 남색 */
:root {
  /* 앱 화면(테마 따라 바뀜) */
  --desk: #e7ecf1;
  --surface: #ffffff;
  --ink: #1d2733;
  --muted: #5d6b7a;
  --line: #d3dbe3;
  --accent: #1f4e79;
  --accent-soft: #dde8f3;
  --danger: #b3261e;
  /* 종이(문서) — 늘 밝은 종이 */
  --paper: #ffffff;
  --paper-ink: #16202b;
  --paper-sub: #52606e;
  --paper-rule: #2f3a46;
  --paper-grid: #cbd3db;
  --paper-head: #e1eef6;
  --paper-head-ink: #1f4e79;
  --paper-lab: #f2f6f9;
  --paper-na: #f1f3f5;
  --paper-hol: #eceef1;
  --paper-red: #c62828;
  --paper-today: #fff5cf;
  --paper-faint: #a3adb8;
  --abs-bg: #fde3e1; --abs-ink: #b3261e;
  --late-bg: #fff0c7; --late-ink: #8a5a00;
  --early-bg: #ebe4fb; --early-ink: #5b3fa0;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-doc: "Nanum Gothic", "나눔고딕", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #13181e; --surface: #1c232b; --ink: #e5e9ee; --muted: #9aa7b4;
    --line: #33404c; --accent: #8cbbe8; --accent-soft: #243646; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #13181e; --surface: #1c232b; --ink: #e5e9ee; --muted: #9aa7b4;
  --line: #33404c; --accent: #8cbbe8; --accent-soft: #243646; --danger: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 14px/1.5 var(--font-ui); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── 도구줄 ── */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1120px; margin: 0 auto; padding: 8px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.brand { font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; color: var(--accent); }
.brand span { color: var(--ink); }
.tabs { display: flex; gap: 2px; background: var(--desk); border-radius: 999px; padding: 3px; overflow-x: auto; max-width: 100%; }
.tab { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.sync { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.cloud::before { background: #2e9d5b; }
.sync.err::before { background: var(--danger); }

.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; display: grid; gap: 12px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .grow { flex: 1 1 auto; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: var(--radius); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { color: var(--danger); }
.btn.icon { padding: 6px 10px; }
.btn:disabled { opacity: .45; cursor: default; }
.field { border: 1px solid var(--line); background: var(--surface); padding: 6px 10px; border-radius: var(--radius); min-width: 0; }
.field:disabled { opacity: .5; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }

/* ── 종이(문서) ── */
.sheet { background: var(--paper); color: var(--paper-ink); font-family: var(--font-doc); border-radius: 14px; box-shadow: 0 1px 2px rgba(20,40,60,.08), 0 10px 30px rgba(20,40,60,.08); padding: 24px 24px 28px; min-width: 0; }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 16px; gap: 8px; }
.sheet-head .cls { justify-self: start; font-size: 12px; font-weight: 700; color: var(--paper-sub); letter-spacing: .04em; }
.sheet-head h1 { grid-column: 2; margin: 0; font-size: 23px; font-weight: 800; letter-spacing: -0.02em; text-align: center; text-wrap: balance; }
.sheet-head h1::after { content: ""; display: block; width: 44px; height: 3px; border-radius: 2px; background: var(--paper-head-ink); margin: 7px auto 0; opacity: .8; }
.sheet-head .wk { grid-column: 3; justify-self: end; display: inline-flex; align-items: baseline; gap: 6px; background: var(--paper-head); color: var(--paper-head-ink); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sheet-head .wk small { font-size: 11.5px; font-weight: 700; }
.grid-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.frame { position: relative; border: 1.5px solid var(--paper-rule); border-radius: 10px; overflow: hidden; background: var(--paper); }
.frame.plan-frame { min-width: 860px; }
table.plan { width: 100%; border-collapse: collapse; table-layout: fixed; }
table.plan th, table.plan td { border: 1px solid var(--paper-grid); padding: 0; vertical-align: middle; text-align: center; }
table.plan tr > :first-child { border-left: 0; }
table.plan tr > :last-child { border-right: 0; }
table.plan thead th { border-top: 0; border-bottom: 1.5px solid var(--paper-rule); background: var(--paper-head); color: var(--paper-head-ink); font-size: 13.5px; font-weight: 800; height: 30px; }
table.plan tbody:last-child tr:last-child > * { border-bottom: 0; }
table.plan col.c-date { width: 50px; } table.plan col.c-lab { width: 30px; } table.plan col.c-todo { width: 104px; }
table.plan tbody.day + tbody.day tr:first-child > * { border-top: 1.5px solid var(--paper-rule); }
table.plan .lab { background: var(--paper-lab); color: var(--paper-sub); font-size: 10.5px; font-weight: 700; line-height: 1.25; padding: 2px 0; }
table.plan .r-subj td, table.plan .r-subj th { height: 32px; }
table.plan .r-topic td { height: 50px; }
table.plan .r-note td, table.plan .r-note th { height: 20px; }
table.plan th.date { background: var(--paper-lab); font-size: 15px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
table.plan th.date small { display: block; font-size: 11px; font-weight: 700; color: var(--paper-sub); margin-top: 2px; }
table.plan th.date .hn { display: block; color: var(--paper-red); font-size: 9.5px; font-weight: 700; line-height: 1.2; padding: 2px 2px 0; overflow-wrap: anywhere; }
table.plan tbody.today th.date { background: var(--paper-today); }
table.plan tbody.today th.date small::after { content: "오늘"; display: block; margin-top: 3px; font-size: 10px; color: #9a6b00; }
table.plan tbody.hol th.date { color: var(--paper-red); }
td.subj { font-size: 15px; font-weight: 800; cursor: pointer; position: relative; user-select: none; -webkit-user-select: none; letter-spacing: -0.01em; }
td.subj:hover { box-shadow: inset 0 0 0 2px var(--accent); }
td.subj .alt { font-size: 10px; font-weight: 700; display: block; line-height: 1.1; opacity: .7; }
td.subj.empty::after { content: "+"; color: var(--paper-faint); font-weight: 400; font-size: 18px; }
td.subj .grip { position: absolute; top: 4px; bottom: 4px; right: -1px; width: 10px; cursor: ew-resize; touch-action: none; display: flex; align-items: center; justify-content: center; z-index: 2; }
td.subj .grip::before { content: ""; width: 3px; height: 16px; border-radius: 2px; background: rgba(31,78,121,.35); opacity: 0; transition: opacity .15s; }
td.subj:hover .grip::before, td.subj:focus-visible .grip::before { opacity: 1; }
@media (hover: none) { td.subj .grip::before { opacity: .6; } td.subj .grip { width: 16px; } }
.drag-ghost { position: absolute; border: 2px dashed var(--paper-head-ink); background: rgba(31,78,121,.10); border-radius: 6px; pointer-events: none; z-index: 5; display: flex; align-items: center; justify-content: center; }
.drag-ghost span { background: var(--paper-head-ink); color: #fff; font: 700 12px var(--font-ui); padding: 2px 10px; border-radius: 999px; }
td.na { background: var(--paper-na) repeating-linear-gradient(135deg, transparent 0 6px, rgba(0,0,0,.04) 6px 7px); }
td.hol { background: var(--paper-hol); color: #4b5560; font-size: 13px; font-weight: 700; }
.hbtn { margin-left: 8px; font: 11px var(--font-ui); border: 1px solid #a7b0b9; background: #fff; color: #333; border-radius: 999px; padding: 2px 10px; }
.hbtn.sm { font-size: 9.5px; margin: 3px 0 0; padding: 1px 6px; }
.ed { display: block; width: 100%; min-height: 100%; padding: 3px 5px; outline: none; font-size: 12px; line-height: 1.4; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.ed:focus { background: #fffbe6; box-shadow: inset 0 0 0 2px #e0b200; }
.ed:empty::before { content: attr(data-ph); color: #c3c9d0; }
.r-note .ed { font-size: 10.5px; padding: 1px 4px; color: var(--paper-sub); }
td.todo { background: #fcfdfe; }
td.todo .ed { font-size: 12px; min-height: 100px; display: flex; align-items: center; justify-content: center; text-align: center; }
.boxed { margin: 4px 6px; border: 1.5px solid var(--paper-rule); border-radius: 6px; padding: 4px; min-height: 36px; display: flex; align-items: center; justify-content: center; }
.boxed .ed { padding: 0; text-align: center; font-weight: 700; }
.drag-tip { font: 12px var(--font-ui); color: var(--paper-sub); margin: 8px 2px 0; }

/* 하단: 학생 명단 + MEMO */
.bottom { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; margin-top: 20px; align-items: stretch; }
.frame.roster-frame { min-width: 600px; }
table.roster { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12.5px; }
table.roster th, table.roster td { border: 1px solid var(--paper-grid); height: 27px; text-align: center; padding: 0; }
table.roster tr > :first-child { border-left: 0; }
table.roster tr > :last-child { border-right: 0; }
table.roster tbody tr:last-child > * { border-bottom: 0; }
table.roster thead th { border-top: 0; border-bottom: 1.5px solid var(--paper-rule); font-weight: 800; font-size: 12px; background: var(--paper-head); color: var(--paper-head-ink); height: 30px; }
table.roster thead .ed { font-weight: 800; color: var(--paper-head-ink); text-align: center; font-size: 12px; min-height: 29px; display: flex; align-items: center; justify-content: center; }
table.roster col.c-no { width: 34px; } table.roster col.c-name { width: 72px; } table.roster col.c-att { width: 30%; }
table.roster td.no { font-variant-numeric: tabular-nums; color: var(--paper-sub); background: var(--paper-lab); }
table.roster td.nm { font-weight: 700; }
table.roster tbody tr:nth-child(5n) > * { border-bottom-color: #9fabb7; }
table.roster td .ed { text-align: center; font-size: 12.5px; min-height: 26px; display: flex; align-items: center; justify-content: center; }
table.roster td.att { padding: 2px 4px; cursor: pointer; text-align: left; }
table.roster td.att:hover { box-shadow: inset 0 0 0 2px var(--accent); }
.att-chips { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; min-height: 22px; }
.att-chips .none { color: #c3c9d0; font-size: 11px; font-family: var(--font-ui); }
.chip-att { display: inline-flex; gap: 3px; align-items: center; border-radius: 999px; padding: 1px 7px; font: 700 10.5px var(--font-ui); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip-att em { font-style: normal; font-weight: 400; opacity: .9; overflow: hidden; text-overflow: ellipsis; }
.t-abs { background: var(--abs-bg); color: var(--abs-ink); }
.t-late { background: var(--late-bg); color: var(--late-ink); }
.t-early { background: var(--early-bg); color: var(--early-ink); }
.memo { border: 1.5px solid var(--paper-rule); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-height: 240px; }
.memo-h { text-align: center; font-weight: 800; letter-spacing: .12em; border-bottom: 1.5px solid var(--paper-rule); height: 30px; display: flex; align-items: center; justify-content: center; font-size: 13px; background: var(--paper-head); color: var(--paper-head-ink); }
.memo .ed { flex: 1; font-size: 13px; padding: 0 12px; line-height: 27px; min-height: 200px; background: repeating-linear-gradient(to bottom, transparent 0 26px, #e3e8ed 26px 27px); background-attachment: local; }

/* ── 휴대폰 카드 보기 ── */
.daytabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
.daytab { border: 1px solid var(--paper-grid); background: var(--paper); padding: 7px 0; border-radius: 10px; font: 800 14px var(--font-doc); color: var(--paper-ink); line-height: 1.25; }
.daytab small { display: block; font-weight: 400; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--paper-sub); }
.daytab[aria-selected="true"] { background: var(--paper-head-ink); border-color: var(--paper-head-ink); color: #fff; }
.daytab[aria-selected="true"] small { color: #d7e6f3; }
.daytab.hol small { color: var(--paper-red); }
.daytab[aria-selected="true"].hol small { color: #ffc9c4; }
.daytab.today { box-shadow: 0 0 0 2px #e0b200; }
.cards { display: grid; gap: 8px; }
.pcard { display: grid; grid-template-columns: 50px 78px minmax(0, 1fr); border: 1px solid var(--paper-grid); border-radius: 10px; overflow: hidden; }
.pcard .pn { background: var(--paper-lab); color: var(--paper-sub); font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.2; border-right: 1px solid var(--paper-grid); }
.pcard .ps { font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; border: 0; border-right: 1px solid var(--paper-grid); font-family: var(--font-doc); color: #111; padding: 4px; text-align: center; line-height: 1.2; }
.pcard .pt { display: grid; min-width: 0; }
.pcard .pt .ed { font-size: 13px; min-height: 30px; padding: 5px 8px; }
.pcard .pt .ed.note { font-size: 11.5px; color: var(--paper-sub); border-top: 1px dashed var(--paper-grid); min-height: 24px; }
.pcard.na { opacity: .55; }
.todo-card { border: 1px solid var(--paper-grid); border-radius: 10px; overflow: hidden; }
.todo-card .h { background: var(--paper-head); color: var(--paper-head-ink); font-weight: 800; font-size: 12px; padding: 4px 10px; }
.todo-card .ed { font-size: 13px; min-height: 40px; padding: 6px 10px; }
.holcard { border: 1px solid var(--paper-grid); border-radius: 10px; background: var(--paper-hol); padding: 24px 12px; text-align: center; font-weight: 800; color: var(--paper-red); display: grid; gap: 8px; justify-items: center; }
.vac-banner { border: 1px dashed var(--paper-rule); border-radius: 10px; padding: 10px; text-align: center; margin-bottom: 12px; font-weight: 700; color: var(--paper-red); }

/* ── 월별 출결 ── */
.mhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.mhead h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { border-radius: 10px; padding: 6px 12px; font: 600 12px var(--font-ui); display: grid; gap: 0; min-width: 76px; }
.stat b { font: 800 20px var(--font-doc); font-variant-numeric: tabular-nums; }
.stat.all { background: var(--paper-lab); color: var(--paper-sub); }
.frame.month-frame { min-width: 720px; }
table.month { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
table.month th, table.month td { border: 1px solid var(--paper-grid); text-align: center; height: 28px; padding: 0; }
table.month tr > :first-child { border-left: 0; }
table.month tr > :last-child { border-right: 0; }
table.month tbody tr:last-child > * { border-bottom: 0; }
table.month thead th { border-top: 0; border-bottom: 1.5px solid var(--paper-rule); background: var(--paper-head); color: var(--paper-head-ink); font-weight: 800; font-size: 11.5px; line-height: 1.15; height: 36px; }
table.month thead th small { display: block; font-weight: 400; font-size: 10px; }
table.month thead th.hol { color: var(--paper-red); background: #f3e6e6; }
table.month thead th.mon, table.month td.mon { border-left: 1.5px solid #9fabb7; }
table.month col.c-no { width: 30px; } table.month col.c-name { width: 64px; } table.month col.c-sum { width: 38px; }
table.month td.no { color: var(--paper-sub); background: var(--paper-lab); font-variant-numeric: tabular-nums; }
table.month td.nm { font-weight: 700; }
table.month td.hol { background: var(--paper-hol); }
table.month td.today { background: var(--paper-today); }
table.month button.mc { width: 100%; height: 100%; min-height: 27px; border: 0; background: transparent; padding: 0; font: 800 11px var(--font-ui); }
table.month button.mc.t-abs { background: var(--abs-bg); } table.month button.mc.t-late { background: var(--late-bg); } table.month button.mc.t-early { background: var(--early-bg); }
table.month button.mc:hover { box-shadow: inset 0 0 0 2px var(--accent); }
table.month td.sum { font: 800 12.5px var(--font-doc); font-variant-numeric: tabular-nums; background: var(--paper-lab); }
table.month td.sum.z { color: #c3c9d0; font-weight: 400; }
table.month tbody tr:nth-child(5n) > * { border-bottom-color: #9fabb7; }
.reclist { margin-top: 18px; display: grid; gap: 6px; }
.reclist h2 { margin: 0 0 4px; font-size: 15px; font-weight: 800; }
.rec { display: grid; grid-template-columns: 96px 110px 56px minmax(0, 1fr); gap: 8px; align-items: center; border-bottom: 1px solid var(--paper-grid); padding: 6px 2px; font-size: 13px; }
.rec .d { font-variant-numeric: tabular-nums; color: var(--paper-sub); font-weight: 700; }
.rec .n { font-weight: 700; }
.rec .r { color: var(--paper-sub); overflow-wrap: anywhere; }
.empty-note { color: var(--paper-sub); font: 13px var(--font-ui); padding: 12px 2px; }

/* ── 패널(과목·템플릿·설정) ── */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.panel h2 { margin: 0; font-size: 16px; font-weight: 600; }
.panel h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.rows { display: grid; gap: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row > .field.grow { flex: 1 1 140px; }
.subj-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px; border: 1px solid var(--line); border-radius: 10px; }
.subj-row .chip { width: 64px; }
.chip { display: inline-flex; align-items: center; justify-content: center; min-height: 32px; padding: 2px 10px; border-radius: 8px; font: 800 14px var(--font-doc); border: 1px solid rgba(0,0,0,.14); color: #111; }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0,0,0,.2); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
input[type="color"] { width: 34px; height: 28px; border: 1px solid var(--line); border-radius: 6px; padding: 1px; background: var(--surface); }
.grid2 { display: grid; align-items: start; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.tpl-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tpl-pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; }
.tpl-pill[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tpl-pill .star { color: #d19a00; }
textarea.field { width: 100%; min-height: 160px; resize: vertical; line-height: 1.6; }

<script>
(() => {
"use strict";

/* ───────── 날짜 도구 ───────── */
const DAYS = ["월", "화", "수", "목", "금"];
const WEEKDAY = "일월화수목금토";
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const md = d => `${d.getMonth() + 1}.${d.getDate()}`;
function todayKST() {
  try { return parse(new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date())); }
  catch { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
}

/* ───────── 대한민국 공휴일 (대체공휴일 포함, 2026–2028) ───────── */
const KR_HOLIDAYS = {
  "2026-01-01": "신정", "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴",

  "2026-05-24": "부처님오신날", "2026-05-25": "대체공휴일(부처님오신날)", "2026-06-03": "지방선거일",
  "2026-06-06": "현충일", "2026-07-17": "제헌절", "2026-08-15": "광복절", "2026-08-17": "대체공휴일(광복절)",
  "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴",
  "2026-10-03": "개천절", "2026-10-05": "대체공휴일(개천절)", "2026-10-09": "한글날", "2026-12-25": "성탄절",
  "2027-01-01": "신정", "2027-02-06": "설날 연휴", "2027-02-07": "설날", "2027-02-08": "설날 연휴", "2027-02-09": "대체공휴일(설날)",
  "2027-03-01": "삼일절", "2027-05-05": "어린이날", "2027-05-13": "부처님오신날", "2027-06-06": "현충일",
  "2027-07-17": "제헌절", "2027-07-19": "대체공휴일(제헌절)", "2027-08-15": "광복절", "2027-08-16": "대체공휴일(광복절)",
  "2027-09-14": "추석 연휴", "2027-09-15": "추석", "2027-09-16": "추석 연휴",
  "2027-10-03": "개천절", "2027-10-04": "대체공휴일(개천절)", "2027-10-09": "한글날", "2027-10-11": "대체공휴일(한글날)",
  "2027-12-25": "성탄절", "2027-12-27": "대체공휴일(성탄절)",
  "2028-01-01": "신정", "2028-01-25": "설날 연휴", "2028-01-26": "설날", "2028-01-27": "설날 연휴",
  "2028-03-01": "삼일절", "2028-04-12": "국회의원 선거일", "2028-05-02": "부처님오신날", "2028-05-05": "어린이날",
  "2028-06-06": "현충일", "2028-07-17": "제헌절", "2028-08-15": "광복절",
  "2028-10-02": "추석 연휴", "2028-10-03": "추석·개천절", "2028-10-04": "추석 연휴", "2028-10-05": "대체공휴일(추석)",
  "2028-10-09": "한글날", "2028-12-25": "성탄절"
};

/* ───────── 기본 데이터 ───────── */
const uid = () => Math.random().toString(36).slice(2, 9);
const C = { yellow: "#fff1a6", green: "#d3ee9f", blue: "#d5ebf5" };
const PRESETS = ["#fff1a6", "#d3ee9f", "#d5ebf5", "#fbd3dc", "#ffdcb0", "#e2daf7", "#cdeedf", "#f3e3cb", "#e6e8eb", "#ffffff"];
const ROSTER = ["김민호", "김서하", "김서현", "김시현", "김유찬", "김이솔", "김재준", "문샛별", "박주경", "박해민", "서로하", "손연수", "신주호", "안지호", "이수빈",
  "이정원", "전지윤", "정재인", "최시원", "최재우", "황지효", "장하선"];
const ATT_TYPES = [["결석", "t-abs"], ["지각", "t-late"], ["조퇴", "t-early"]];
const attCls = t => (ATT_TYPES.find(x => x[0] === t) || [, ""])[1];
const COLS = 4;

function defaultState() {
  const names = [["국어", C.blue], ["수학", C.blue], ["사회", C.blue], ["과학", C.yellow], ["영어", C.yellow], ["도덕", C.yellow],
    ["실과", C.blue], ["체육", C.green], ["음악", C.blue], ["미술", C.blue], ["창체", C.blue], ["코딩", C.blue], ["도서관", C.blue], ["연극", C.green]];
  const subjects = names.map(([name, color]) => ({ id: "s_" + uid(), name, color }));
  const S = n => subjects.find(s => s.name === n).id;
  const c = (s, t = "", n = "", extra = {}) => ({ s: s ? S(s) : null, t, n, span: 1, ...extra });
  const E = () => c(null);
  const tpl = {
    id: "t_" + uid(), name: "기본 시간표",
    days: [
      { count: 6, todo: "", cells: [c("과학", "교과 학습"), c("코딩", "코딩 수업", "컴퓨터실(코딩)"), c("체육", "교과 학습"), c("수학"), c("실과", "", "짝수 주 실과 / 홀수 주 사회", { span: 2, o: S("사회") }), E()] },
      { count: 6, todo: "리더십교육 안내", cells: [c("도서관", "독서"), c("연극", "교과 학습"), c("영어", "교과 학습"), c("국어"), c("국어"), c("체육", "교과 학습")] },
      { count: 5, todo: "", cells: [c("국어"), c("도덕", "교과 학습"), c("창체", "사회정서교육", "", { span: 2, box: true }), E(), c("영어", "교과 학습"), E()] },
      { count: 6, todo: "", cells: [c("과학", "교과 학습"), c("과학", "교과 학습"), c("영어", "교과 학습"), c("수학"), c("사회"), c("사회")] },
      { count: 6, todo: "", cells: [c("국어"), c("국어"), c("미술", "플레이북"), c("미술"), c("체육", "체육관"), c("창체", "학급회의")] }
    ]
  };
  const blank = { id: "t_" + uid(), name: "빈 시간표", days: DAYS.map(() => ({ count: 6, todo: "", cells: Array.from({ length: 6 }, E) })) };
  return {
    v: 2,
    settings: {
      className: "6학년 1반",
      semesters: [{ name: "1학기", start: "2026-03-03", end: "2026-07-24" }, { name: "2학기", start: "2026-08-24", end: "2027-02-12" }],
      holidays: [
        { name: "여름방학", start: "2026-07-25", end: "2026-08-23", vacation: true },
        { name: "겨울방학", start: "2027-01-08", end: "2027-02-01", vacation: true }
      ],
      hiddenBuiltins: [],
      weekendNext: true,
      students: ROSTER.map(name => ({ id: "p_" + uid(), name })),
      defaultTemplateId: tpl.id
    },
    subjects,
    templates: [tpl, blank],
    weeks: {}
  };
}

/* 예전 버전 데이터를 새 형식으로 */
const OLD_COLORS = { "#fff27a": C.yellow, "#bfe86b": C.green, "#cde8f2": C.blue };
function migrateWeek(w) {
  let ch = false;
  if (w.checks) {
    w.marks = w.marks || {};
    for (const [id, arr] of Object.entries(w.checks)) w.marks[id] = Array.from({ length: COLS }, (_, j) => (arr && arr[j]) ? "✔" : "");
    delete w.checks; ch = true;
  }
  return ch;
}
function migrate(s) {
  let ch = false;
  if ((s.v || 1) < 2) {
    (s.subjects || []).forEach(x => { const n = OLD_COLORS[String(x.color || "").toLowerCase()]; if (n) x.color = n; });
    const names = (s.settings.students || []).map(p => p.name);
    if (names.length === 15 && names.every((n, i) => n === ROSTER[i])) ROSTER.slice(15).forEach(name => s.settings.students.push({ id: "p_" + uid(), name }));
    delete s.settings.checkTitles;
    s.v = 2; ch = true;
  }
  for (const w of Object.values(s.weeks || {})) ch = migrateWeek(w) || ch;
  return ch;
}

/* ───────── 상태 & 저장 ───────── */
const LS_KEY = "weekly-plan-v1";
const UI_KEY = "weekly-plan-ui";
let state;
try { state = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch { state = null; }
if (!state || !state.settings || !Array.isArray(state.templates)) state = defaultState();
state.weeks = state.weeks || {};
const bootMigrated = migrate(state);

const ui = { tab: "week", ws: null, day: null, view: "auto", tplId: null, month: null };
try { Object.assign(ui, JSON.parse(localStorage.getItem(UI_KEY) || "{}"), { ws: null, day: null, month: null }); } catch {}
const saveUI = () => { try { localStorage.setItem(UI_KEY, JSON.stringify({ tab: ui.tab, view: ui.view, tplId: ui.tplId })); } catch {} };

let DB = null, DL = null;
const dirty = new Set();
let flushTimer = null, flushing = false;
const syncEl = document.getElementById("sync");
function setSync(text, cls) { syncEl.textContent = text; syncEl.className = "sync " + (cls || ""); }

function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch {} }
if (bootMigrated) saveLocal();
function persist(keys) {
  keys.forEach(k => dirty.add(k));
  saveLocal();
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 700);
}
const configDoc = () => ({ v: state.v || 2, settings: state.settings, subjects: state.subjects, templates: state.templates });
async function flush() {
  if (!DB) { dirty.clear(); return; }
  if (flushing) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 500); return; }
  flushing = true;
  setSync("저장 중…", "cloud");
  const keys = [...dirty]; dirty.clear();
  try {
    for (const k of keys) {
      if (k === "config") await DB.col.doc("config").set(JSON.parse(JSON.stringify(configDoc())));
      else {
        const ws = k.slice(2), w = state.weeks[ws], ref = DB.col.doc("w-" + ws);
        if (w) await ref.set(JSON.parse(JSON.stringify(w))); else await ref.delete();
      }
    }
    setSync("계정에 저장됨", "cloud");
  } catch (e) {
    keys.forEach(k => dirty.add(k));
    setSync("저장 실패 · 이 기기에만 저장됨", "err");
    if (e && e.code === "unavailable") { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 3000 + Math.random() * 2000); }
  } finally { flushing = false; }
}

async function connectCloud() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    window.claude.use("downloads").then(d => { DL = d; }).catch(() => {});
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const col = db.collection("data/users/" + id);
    const snap = await col.limit(1000).get();
    DB = { col };
    if (snap.empty) {
      dirty.add("config");
      Object.keys(state.weeks).forEach(k => dirty.add("w:" + k));
    } else {
      const remoteWeeks = new Set();
      for (const d of snap.docs) {
        const data = d.data();
        if (d.id === "config" && data && data.settings) {
          state.v = data.v || 1; state.settings = clone(data.settings); state.subjects = clone(data.subjects); state.templates = clone(data.templates);
        } else if (d.id.startsWith("w-") && data) {
          const ws = d.id.slice(2); state.weeks[ws] = clone(data); remoteWeeks.add(ws);
        }
      }
      Object.keys(state.weeks).forEach(k => { if (!remoteWeeks.has(k)) dirty.add("w:" + k); });
      if (migrate(state)) { dirty.add("config"); Object.keys(state.weeks).forEach(k => dirty.add("w:" + k)); }
    }
    saveLocal();
    setSync("계정에 저장됨", "cloud");
    render();
    if (dirty.size) flush();
  } catch { setSync("이 기기에 저장", ""); }
}

/* ───────── 되돌리기 ───────── */
const undoStack = [];
function pushUndo() { undoStack.push(JSON.stringify(state)); if (undoStack.length > 40) undoStack.shift(); }
function undo() {
  const prev = undoStack.pop();
  if (!prev) { toast("되돌릴 작업이 없어요"); return; }
  const old = JSON.parse(prev);
  const keys = ["config"];
  const all = new Set([...Object.keys(old.weeks), ...Object.keys(state.weeks)]);
  all.forEach(k => { if (JSON.stringify(old.weeks[k]) !== JSON.stringify(state.weeks[k])) keys.push("w:" + k); });
  state = old;
  persist(keys);
  render();
  toast("되돌렸어요");
}
function mutate(fn, keys) { pushUndo(); fn(); persist(keys); render(); }

/* ───────── 도움 함수 ───────── */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const subj = id => state.subjects.find(s => s.id === id);
const tplById = id => state.templates.find(t => t.id === id);
const defaultTpl = () => tplById(state.settings.defaultTemplateId) || state.templates[0];
function textColor(hex) {
  const h = (hex || "#ffffff").replace("#", "");
  const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.3 ? "#111111" : "#ffffff";
}
const chipStyle = color => `background:${esc(color)};color:${textColor(color)}`;
const clone = o => JSON.parse(JSON.stringify(o));
const blankCell = s => ({ s: s || null, t: "", n: "", span: 1 });

function holidayOn(dateStr) {
  const custom = state.settings.holidays.find(h => h.start && h.start <= dateStr && dateStr <= (h.end || h.start));
  if (custom) return { name: custom.name, vacation: !!custom.vacation };
  if (KR_HOLIDAYS[dateStr] && !state.settings.hiddenBuiltins.includes(dateStr)) return { name: KR_HOLIDAYS[dateStr], vacation: false };
  return null;
}
const isVacationWeek = ws => DAYS.every((_, i) => { const h = holidayOn(ymd(addDays(ws, i))); return h && h.vacation; });

function weekInfo(ws) {
  for (const sem of state.settings.semesters) {
    if (!sem.start || !sem.end) continue;
    const s = mondayOf(parse(sem.start)), e = parse(sem.end);
    if (ws < s || ws > e) continue;
    if (isVacationWeek(ws)) return { n: null, vacation: true, sem };
    let n = 0;
    for (let w = s; w <= ws; w = addDays(w, 7)) if (!isVacationWeek(w)) n++;
    return { n, vacation: false, sem };
  }
  return { n: null, vacation: isVacationWeek(ws), sem: null };
}

function blankDay() { return { count: 6, todo: "", cells: Array.from({ length: 6 }, () => blankCell()) }; }
function daysFromTemplate(tpl, weekNo) {
  const odd = weekNo != null && weekNo % 2 === 1;
  return (tpl ? tpl.days : DAYS.map(blankDay)).map(d => ({
    count: d.count, todo: d.todo || "",
    cells: d.cells.map(c => ({ s: odd && c.o ? c.o : c.s, t: c.t || "", n: c.n || "", span: c.span || 1, box: !!c.box }))
  }));
}
function virtualWeek(ws) {
  const tpl = defaultTpl();
  return { templateId: tpl ? tpl.id : null, days: daysFromTemplate(tpl, weekInfo(ws).n), marks: {}, colTitles: ["", "", "", ""], att: {}, memo: "", open: [false, false, false, false, false] };
}
const wsKey = () => ymd(ui.ws);
const curWeek = () => state.weeks[wsKey()] || virtualWeek(ui.ws);
function ensureWeekFor(ws) { const k = ymd(ws); if (!state.weeks[k]) state.weeks[k] = virtualWeek(ws); return state.weeks[k]; }
const ensureWeek = () => ensureWeekFor(ui.ws);

/* 출결: 주 문서 안에 att[학생ID][요일번호] = {t: 결석|지각|조퇴, r: 사유} */
function getAtt(ws, sid, d) { const w = state.weeks[ymd(ws)]; return (w && w.att && w.att[sid] && w.att[sid][d]) || null; }
function setAtt(ws, sid, d, patch) {
  const w = ensureWeekFor(ws);
  w.att = w.att || {};
  const cur = Object.assign({ t: "", r: "" }, (w.att[sid] || {})[d], patch);
  if (!cur.t) { if (w.att[sid]) delete w.att[sid][d]; if (w.att[sid] && !Object.keys(w.att[sid]).length) delete w.att[sid]; }
  else { w.att[sid] = w.att[sid] || {}; w.att[sid][d] = cur; }
  persist(["w:" + ymd(ws)]);
}

/* 편집 대상: 주간학습 화면이면 이번 주, 템플릿 화면이면 선택한 템플릿 */
function ctx() {
  if (ui.tab === "tpl") { const t = tplById(ui.tplId) || defaultTpl(); return { mode: "tpl", days: t.days, get: () => t.days, key: "config", tpl: t }; }
  return { mode: "week", days: curWeek().days, get: () => ensureWeek().days, key: "w:" + wsKey() };
}

/* 칸 목록(병합 반영) */
function layoutCells(day) {
  const out = [];
  for (let i = 0; i < 6;) {
    if (i >= day.count) { out.push({ i, na: true, span: 1 }); i++; continue; }
    const c = day.cells[i] || blankCell();
    const span = Math.max(1, Math.min(c.span || 1, day.count - i));
    out.push({ i, c, span });
    i += span;
  }
  return out;
}
const spanOf = (day, p) => Math.max(1, Math.min((day.cells[p] || {}).span || 1, day.count - p));

/* 블록 길이 바꾸기: 늘리면 오른쪽 칸을 흡수, 줄이면 풀린 칸은 같은 과목의 1교시 칸이 됨 */
function setSpan(day, p, n) {
  n = Math.max(1, Math.min(n, day.count - p));
  const c = day.cells[p] || (day.cells[p] = blankCell());
  const old = spanOf(day, p);
  if (n > old) {
    let j = p + old;
    while (j < p + n) {
      const b = day.cells[j] || blankCell(), bs = Math.max(1, b.span || 1);
      if (!c.s && b.s) c.s = b.s;
      if (!c.t && b.t) c.t = b.t;
      if (!c.n && b.n) c.n = b.n;
      for (let k = j; k < j + bs && k < 6; k++) day.cells[k] = k < p + n ? blankCell() : blankCell(b.s);
      j += bs;
    }
  } else if (n < old) {
    for (let k = p + n; k < p + old; k++) day.cells[k] = blankCell(c.s);
  }
  c.span = n;
}

function edAttr(ph) { return `contenteditable="true" spellcheck="false" data-ph="${esc(ph)}"`; }

function subjCellInner(c, mode) {

}

  days.forEach((day, d) => {
    const date = ws ? addDays(ws, d) : null;
    const ds = date ? ymd(date) : "";

    const off = hol && !(week && week.open && week.open[d]);
    const cls = ["day", ds === today ? "today" : "", off ? "hol" : ""].join(" ");

    h += `<tbody class="${cls}">`;
    if (off) {

        <tr class="r-topic"><th class="date" rowspan="2">${dateLabel}<span class="hn">${esc(hol.name)}</span></th><th class="lab">단원<br>및<br>주제</th>
        <td class="hol" colspan="6" rowspan="2">휴일<button class="hbtn no-print" data-act="open-day" data-d="${d}">수업일로 바꾸기</button></td></tr>
        <tr class="r-note"><th class="lab"></th></tr>`;
    } else {
      let r1 = "", r2 = "", r3 = "";
      for (const x of layoutCells(day)) {
        if (x.na) { r1 += `<td class="na"></td>`; r2 += `<td class="na"></td>`; r3 += `<td class="na"></td>`; continue; }

        const topic = `<div class="ed" ${edAttr("")} data-k="cell" data-f="t" data-d="${d}" data-p="${x.i}">${esc(x.c.t)}</div>`;
        r2 += `<td${sp}>${x.c.box ? `<div class="boxed">${topic}</div>` : topic}</td>`;
        r3 += `<td${sp}><div class="ed" ${edAttr("")} data-k="cell" data-f="n" data-d="${d}" data-p="${x.i}">${esc(x.c.n)}</div></td>`;
      }
      const openNote = hol ? `<span class="hn">${esc(hol.name)}</span><button class="hbtn sm no-print" data-act="close-day" data-d="${d}">휴일로</button>` : "";
      h += `<tr class="r-subj"><th class="lab">날짜</th><th class="lab">교과</th>${r1}${todo}</tr>
        <tr class="r-topic"><th class="date" rowspan="2">${dateLabel}${openNote}</th><th class="lab">단원<br>및<br>주제</th>${r2}</tr>
        <tr class="r-note"><th class="lab"></th>${r3}</tr>`;
    }

  });
  return h + `</table></div></div><p class="drag-tip">과목 칸을 옆 칸까지 끌면 2·3교시 블록으로 합쳐져요. 블록 오른쪽 끝을 끌어 늘이거나 줄일 수 있어요.</p>`;
}

function renderCards(days, mode, ws, week) {

    h += `<button class="daytab${hol ? " hol" : ""}${ds === today ? " today" : ""}" role="tab" aria-selected="${i === d}" data-act="day" data-d="${i}">${DAYS[i]}<small>${date ? (hol ? esc(hol.name.slice(0, 5)) : md(date)) : ""}</small></button>`;

        <div class="ed note" ${edAttr("장소·준비물")} data-k="cell" data-f="n" data-d="${d}" data-p="${x.i}">${esc(x.c.n)}</div></div></div>`;
    }
    h += `</div>`;
  }
  h += `<div class="todo-card" style="margin-top:10px"><div class="h">TO DO</div><div class="ed" ${edAttr("할 일·안내")} data-k="todo" data-d="${d}">${esc(day.todo)}</div></div>`;
  return h;
}

function useCards() { return ui.view === "cards" || (ui.view === "auto" && isNarrow()); }

function renderWeek() {

function attChips(ws, sid) {

}

/* 월별 출결 */
function renderMonth() {
  if (!ui.month) { const t = todayKST(); ui.month = new Date(t.getFullYear(), t.getMonth(), 1); }
  const m0 = ui.month, y = m0.getFullYear(), m = m0.getMonth();
  const last = new Date(y, m + 1, 0).getDate();
  const today = ymd(todayKST());
  const days = [];
  for (let i = 1; i <= last; i++) { const dt = new Date(y, m, i); if (dt.getDay() >= 1 && dt.getDay() <= 5) days.push(dt); }
  const students = state.settings.students;
  const tot = { 결석: 0, 지각: 0, 조퇴: 0 };
  const recs = [];
  const cellsFor = p => days.map(dt => {
    const ds = ymd(dt), hol = holidayOn(ds), a = getAtt(mondayOf(dt), p.id, (dt.getDay() + 6) % 7);
    if (a) { tot[a.t] = (tot[a.t] || 0) + 1; recs.push({ dt, p, a }); }
    const cls = [dt.getDay() === 1 ? "mon" : "", hol && !a ? "hol" : "", ds === today ? "today" : ""].join(" ");
    return `<td class="${cls}"><button class="mc ${a ? attCls(a.t) : ""}" data-act="att-day" data-id="${p.id}" data-date="${ds}" title="${a ? esc(a.t + (a.r ? " · " + a.r : "")) : md(dt) + " 출결 입력"}">${a ? esc(a.t[0]) : ""}</button></td>`;
  }).join("");
  const body = students.map((p, i) => {
    const before = { ...tot };
    const cells = cellsFor(p);
    const sums = ATT_TYPES.map(([t]) => { const n = tot[t] - before[t]; return `<td class="sum${n ? "" : " z"}">${n}</td>`; }).join("");
    return `<tr><td class="no">${i + 1}</td><td class="nm">${esc(p.name)}</td>${cells}${sums}</tr>`;
  }).join("");
  const headDays = days.map(dt => { const hol = holidayOn(ymd(dt)); return `<th class="${dt.getDay() === 1 ? "mon" : ""}${hol ? " hol" : ""}" title="${hol ? esc(hol.name) : ""}">${dt.getDate()}<small>${WEEKDAY[dt.getDay()]}</small></th>`; }).join("");
  recs.sort((a, b) => a.dt - b.dt || students.indexOf(a.p) - students.indexOf(b.p));
  const list = recs.map(({ dt, p, a }) => `<div class="rec"><span class="d">${md(dt)} (${WEEKDAY[dt.getDay()]})</span><span class="n">${students.indexOf(p) + 1}. ${esc(p.name)}</span><span><span class="chip-att ${attCls(a.t)}">${esc(a.t)}</span></span><span class="r">${esc(a.r) || "사유 없음"}</span></div>`).join("");
  const people = new Set(recs.map(r => r.p.id)).size;
  return `<div class="toolbar">
    <div class="seg" role="group" aria-label="달 이동"><button data-act="mprev" aria-label="지난달">◀</button><button data-act="mthis">이번 달</button><button data-act="mnext" aria-label="다음 달">▶</button></div>
    <span class="hint">칸을 눌러 출결을 입력하거나 고칠 수 있어요. 주간학습 화면의 출결 칸과 같은 기록이에요.</span>
  </div>
  <article class="sheet">
    <div class="mhead"><h1>${y}년 ${m + 1}월 출결</h1>
      <div class="stats">
        <div class="stat t-abs">결석<b>${tot.결석}</b></div><div class="stat t-late">지각<b>${tot.지각}</b></div><div class="stat t-early">조퇴<b>${tot.조퇴}</b></div>
        <div class="stat all">기록한 학생<b>${people}</b></div>
      </div></div>
    <div class="grid-wrap"><div class="frame month-frame"><table class="month"><colgroup><col class="c-no"><col class="c-name">${"<col>".repeat(days.length)}<col class="c-sum"><col class="c-sum"><col class="c-sum"></colgroup>

/* ───────── 모달 ───────── */
function openDialog(html, onMount) {
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(scrim);
  const close = () => { scrim.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", e => { if (e.target === scrim) close(); });
  const dlg = scrim.firstChild;
  onMount && onMount(dlg, close);
  const f = dlg.querySelector("[autofocus], button, input, select");
  f && f.focus();
  return close;
}
function ask(title, body, okLabel = "확인", danger = false) {
  return new Promise(res => {
    openDialog(`<h2>${esc(title)}</h2>${body ? `<p class="hint" style="font-size:14px">${esc(body)}</p>` : ""}
      <div class="acts"><button class="btn" data-x="no">취소</button><button class="btn ${danger ? "danger" : "primary"}" data-x="ok" autofocus>${esc(okLabel)}</button></div>`,
      (dlg, close) => {
        let done = false;
        dlg.addEventListener("click", e => { const x = e.target.closest("[data-x]"); if (!x) return; done = true; close(); res(x.dataset.x === "ok"); });
        new MutationObserver((_, o) => { if (!dlg.isConnected) { o.disconnect(); if (!done) res(false); } }).observe(document.body, { childList: true });
      });
  });
}
let toastTimer;
function toast(msg) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 1800);
}

function openCellDialog(d, p) {
  const c0 = ctx();
  const day = c0.days[d], cell = day.cells[p] || {};
  const isTpl = c0.mode === "tpl";
  const span = spanOf(day, p);
  const maxSpan = day.count - p;
  const chips = sel => `<button class="chip none" data-pick="" aria-pressed="${!sel}">비우기</button>` +
    state.subjects.map(s => `<button class="chip" style="${chipStyle(s.color)}" data-pick="${s.id}" aria-pressed="${s.id === sel}">${esc(s.name)}</button>`).join("");
  const title = `${DAYS[d]}요일 ${span > 1 ? `${p + 1}–${p + span}` : p + 1}교시`;
  openDialog(`<h2>${title}</h2>
    <div class="rows"><h3>${isTpl ? "과목 (짝수 주·기본)" : "과목"}</h3><div class="pick" data-g="s">${chips(cell.s)}</div></div>
    ${isTpl ? `<div class="rows"><h3>홀수 주에는 다른 과목 (선택)</h3><select class="field" id="odd-pick"><option value="">같은 과목</option>${state.subjects.map(s => `<option value="${s.id}"${s.id === cell.o ? " selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div>` : ""}
    <div class="rows"><h3>수업 길이 (${p + 1}교시부터)</h3><div class="seg">${Array.from({ length: Math.min(maxSpan, 4) }, (_, k) => `<button data-x="span" data-n="${k + 1}" aria-pressed="${span === k + 1}">${k + 1}교시 블록</button>`).join("")}</div>
      <label class="row" style="gap:4px"><input type="checkbox" id="box-pick" ${cell.box ? "checked" : ""}> 단원 및 주제에 테두리 박스</label></div>
    <div class="rows"><h3>${DAYS[d]}요일 교시 수</h3><div class="seg">${[4, 5, 6].map(n => `<button data-x="count" data-n="${n}" aria-pressed="${day.count === n}">${n}교시</button>`).join("")}</div></div>
    <div class="acts"><button class="btn primary" data-x="close">닫기</button></div>`,
    (dlg, close) => {
      const apply = fn => { pushUndo(); const days = c0.get(); fn(days[d], days[d].cells[p] || (days[d].cells[p] = blankCell())); persist([c0.key]); render(); };
      dlg.addEventListener("click", e => {
        const pk = e.target.closest("[data-pick]");
        if (pk) { apply((_, c) => { c.s = pk.dataset.pick || null; }); close(); return; }
        const x = e.target.closest("[data-x]"); if (!x || x.disabled) return;
        const a = x.dataset.x;
        if (a === "close") close();
        else if (a === "span") { apply(dy => setSpan(dy, p, Number(x.dataset.n))); close(); }
        else if (a === "count") { apply(dy => { dy.count = Number(x.dataset.n); }); close(); }
      });
      const odd = dlg.querySelector("#odd-pick");
      odd && odd.addEventListener("change", () => apply((_, c) => { c.o = odd.value || null; }));
      dlg.querySelector("#box-pick").addEventListener("change", e => apply((_, c) => { c.box = e.target.checked; }));
    });
}

function openAttDialog(sid, dates, title) {
  const p = state.settings.students.find(x => x.id === sid);
  const rowHTML = ({ ws, d }) => {
    const dt = addDays(ws, d), hol = holidayOn(ymd(dt)), a = getAtt(ws, sid, d) || { t: "", r: "" };
    return `<div class="att-row" data-ws="${ymd(ws)}" data-d="${d}">
      <div class="dl">${DAYS[d]} ${md(dt)}${hol ? `<small>${esc(hol.name)}</small>` : ""}</div>
      <div class="seg">${[["", "출석"], ...ATT_TYPES.map(x => [x[0], x[0]])].map(([t, l]) => `<button data-t="${t}" aria-pressed="${a.t === t}">${l}</button>`).join("")}</div>
      <input class="field" placeholder="사유 (예: 감기, 병원 진료)" value="${esc(a.r)}" ${a.t ? "" : "disabled"} aria-label="${DAYS[d]}요일 사유">
    </div>`;
  };
  openDialog(`<h2>${esc(title || "")} · ${state.settings.students.indexOf(p) + 1}. ${esc(p.name)}</h2>
    <div class="rows">${dates.map(rowHTML).join("")}</div>
    <p class="hint">결석·지각·조퇴를 고르고 사유를 적어 두면 출결 탭에서 월별로 모아 볼 수 있어요.</p>
    <div class="acts"><button class="btn primary" data-x="close">닫기</button></div>`,
    (dlg, close) => {
      dlg.addEventListener("click", e => {
        if (e.target.closest("[data-x=close]")) { close(); return; }
        const b = e.target.closest("button[data-t]"); if (!b) return;
        const row = b.closest(".att-row"), ws = parse(row.dataset.ws), d = Number(row.dataset.d);
        pushUndo();
        setAtt(ws, sid, d, { t: b.dataset.t, r: b.dataset.t ? row.querySelector("input").value : "" });
        row.querySelectorAll("button[data-t]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
        const inp = row.querySelector("input"); inp.disabled = !b.dataset.t; if (!b.dataset.t) inp.value = ""; else inp.focus();
        render();
      });
      let pushed = false;
      dlg.addEventListener("input", e => {
        const row = e.target.closest(".att-row"); if (!row) return;
        if (!pushed) { pushUndo(); pushed = true; }
        setAtt(parse(row.dataset.ws), sid, Number(row.dataset.d), { r: e.target.value });
      });
      dlg.addEventListener("change", () => render());
    });
}

let editSnap = null, editPushed = false;

  const el = e.target.closest(".ed");
  if (el) {
    if (!editPushed && editSnap) { undoStack.push(editSnap); if (undoStack.length > 40) undoStack.shift(); editPushed = true; }
    const val = el.innerText.replace(/\n$/, "");
    const k = el.dataset.k, wk = ["w:" + wsKey()];
    if (k === "memo") { ensureWeek().memo = val; persist(wk); return; }
    if (k === "mark") { const w = ensureWeek(); w.marks = w.marks || {}; const arr = w.marks[el.dataset.id] || (w.marks[el.dataset.id] = ["", "", "", ""]); arr[Number(el.dataset.j)] = val; persist(wk); return; }
    if (k === "coltitle") { const w = ensureWeek(); w.colTitles = w.colTitles || ["", "", "", ""]; w.colTitles[Number(el.dataset.j)] = val; persist(wk); return; }
    const c = ctx(), days = c.get(), d = Number(el.dataset.d);
    if (k === "todo") days[d].todo = val;
    else if (k === "cell") { const cell = days[d].cells[Number(el.dataset.p)]; cell[el.dataset.f] = val; }
    persist([c.key]);

});

view.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "jump" && t.value) { ui.ws = mondayOf(parse(t.value)); ui.day = null; render(); return; }
  if (t.id === "week-tpl") {
    const tpl = tplById(t.value);
    const stored = state.weeks[wsKey()];
    if (stored && !(await ask("템플릿을 바꿀까요?", `이 주의 시간표를 '${tpl.name}'(으)로 다시 채워요. 학생 표, 출결, 메모는 그대로 남아요.`, "바꾸기"))) { render(); return; }
    mutate(() => { const w = ensureWeek(); w.templateId = tpl.id; w.days = daysFromTemplate(tpl, weekInfo(ui.ws).n); }, ["w:" + wsKey()]);
    return;
  }
  if (t.dataset.sf === "color" || t.dataset.sf === "name") { pushUndo(); render(); return; }
  if (t.id === "set-students") {
    mutate(() => {
      const old = [...state.settings.students];
      state.settings.students = t.value.split("\n").map(s => s.trim()).filter(Boolean).map(name => {
        const i = old.findIndex(p => p.name === name);
        return i >= 0 ? old.splice(i, 1)[0] : { id: "p_" + uid(), name };
      });
    }, ["config"]);
    toast("학생 명단을 저장했어요");
    return;
  }
  if (t.dataset.set === "sem" && t.dataset.f !== "name") { mutate(() => { state.settings.semesters[Number(t.dataset.i)][t.dataset.f] = t.value; }, ["config"]); return; }
  if (t.dataset.set === "hol" && t.dataset.f !== "name") {
    mutate(() => {
      const h = state.settings.holidays[Number(t.dataset.i)];
      if (t.dataset.f === "vacation") h.vacation = t.value === "1"; else h[t.dataset.f] = t.value;
      if (h.end && h.start && h.end < h.start) h.end = h.start;
    }, ["config"]);
    return;
  }
  if (t.dataset.act === "builtin") {
    mutate(() => { const hb = state.settings.hiddenBuiltins, d = t.dataset.d; const i = hb.indexOf(d); if (t.checked && i >= 0) hb.splice(i, 1); if (!t.checked && i < 0) hb.push(d); }, ["config"]);
    return;
  }
  if (t.id === "import-file" && t.files && t.files[0]) {
    const r = new FileReader();
    r.onload = () => importText(String(r.result));
    r.readAsText(t.files[0]);
  }
});

view.addEventListener("submit", e => {
  if (e.target.id !== "subj-add") return;
  e.preventDefault();
  const inp = document.getElementById("subj-new"); const name = inp.value.trim();
  if (!name) return;
  mutate(() => state.subjects.push({ id: "s_" + uid(), name, color: PRESETS[state.subjects.length % PRESETS.length] }), ["config"]);
  toast(`'${name}' 과목을 추가했어요`);
});

view.addEventListener("keydown", e => {
  const c = e.target.closest("td.subj, td.att");
  if (c && (e.key === "Enter" || e.key === " ") && !e.target.closest(".ed")) { e.preventDefault(); c.click(); }
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !e.target.closest(".ed, input, textarea")) { e.preventDefault(); undo(); }
});

/* ── 끌어서 블록 만들기 ──
   · 과목 칸을 누른 채 옆 칸까지 끌기(마우스): 지나간 칸들을 한 블록으로 합침
   · 블록 오른쪽 끝 손잡이 끌기(마우스·터치): 오른쪽으로 늘이기, 왼쪽으로 줄이기 */
let drag = null, suppressClick = false;
function colAt(table, x) {
  const ths = [...table.querySelectorAll("thead th[data-col]")];
  for (let i = 0; i < ths.length; i++) { const r = ths[i].getBoundingClientRect(); if (x < r.right) return i; }
  return ths.length - 1;
}
function showGhost(a, e) {
  const { table, frame, row } = drag;
  const ths = table.querySelectorAll("thead th[data-col]");
  const fr = frame.getBoundingClientRect(), rr = row.getBoundingClientRect();
  const l = ths[a].getBoundingClientRect().left, r = ths[e - 1].getBoundingClientRect().right;
  let g = frame.querySelector(".drag-ghost");
  if (!g) { g = document.createElement("div"); g.className = "drag-ghost"; g.innerHTML = "<span></span>"; frame.appendChild(g); }
  Object.assign(g.style, { left: (l - fr.left + 1) + "px", top: (rr.top - fr.top + 1) + "px", width: (r - l - 2) + "px", height: (rr.height - 2) + "px" });
  g.firstChild.textContent = e - a > 1 ? `${a + 1}–${e}교시 · ${e - a}교시 블록` : `${a + 1}교시`;
}
view.addEventListener("pointerdown", e => {
  const td = e.target.closest("td.subj");
  if (!td || e.button !== 0) return;
  const grip = e.target.closest(".grip");
  if (!grip && e.pointerType !== "mouse") return;
  const d = Number(td.dataset.d), p = Number(td.dataset.p);
  const day = ctx().days[d];
  drag = { mode: grip ? "resize" : "range", d, p, span: spanOf(day, p), count: day.count, x0: e.clientX, moved: false, table: td.closest("table.plan"), frame: td.closest(".frame"), row: td.parentElement, a: p, e: p + spanOf(day, p) };
  if (grip) e.preventDefault();
  try { td.setPointerCapture(e.pointerId); } catch {}
});
view.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.moved && Math.abs(e.clientX - drag.x0) < 6) return;
  drag.moved = true;
  const k = Math.min(colAt(drag.table, e.clientX), drag.count - 1);
  const day = ctx().days[drag.d];
  if (drag.mode === "resize") { drag.a = drag.p; drag.e = Math.max(drag.p + 1, k + 1); }
  else {
    const blk = layoutCells(day).find(x => !x.na && x.i <= k && k < x.i + x.span) || { i: k, span: 1 };
    drag.a = Math.min(drag.p, blk.i); drag.e = Math.max(drag.p + drag.span, blk.i + blk.span);
  }
  showGhost(drag.a, drag.e);
});
function endDrag() {
  if (!drag) return;
  const g = drag.frame && drag.frame.querySelector(".drag-ghost"); g && g.remove();
  const dr = drag; drag = null;
  if (!dr.moved) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  const n = dr.e - dr.a;
  if (dr.a === dr.p && n === dr.span) return;
  const c = ctx();
  mutate(() => setSpan(c.get()[dr.d], dr.a, n), [c.key]);
  toast(n > 1 ? `${dr.a + 1}–${dr.a + n}교시를 ${n}교시 블록으로 만들었어요` : `${dr.a + 1}교시 한 칸으로 나눴어요`);
}
view.addEventListener("pointerup", endDrag);
view.addEventListener("pointercancel", () => { if (drag) { drag.moved = false; endDrag(); } });

view.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, wk = "w:" + wsKey();
  switch (a) {
    case "prev": ui.ws = addDays(ui.ws, -7); ui.day = null; render(); break;
    case "next": ui.ws = addDays(ui.ws, 7); ui.day = null; render(); break;
    case "thisweek": ui.ws = null; ui.day = null; render(); break;
    case "day": ui.day = Number(b.dataset.d); render(); break;
    case "view-table": ui.view = isNarrow() ? "table" : "auto"; saveUI(); render(); break;
    case "view-cards": ui.view = "cards"; saveUI(); render(); break;
    case "undo": undo(); break;
    case "print": window.print(); break;
    case "cell": if (!suppressClick) openCellDialog(Number(b.dataset.d), Number(b.dataset.p)); break;
    case "att": openAttDialog(b.dataset.id, DAYS.map((_, d) => ({ ws: ui.ws, d })), `${md(ui.ws)}~${md(addDays(ui.ws, 4))} 출결`); break;
    case "att-day": { const dt = parse(b.dataset.date); openAttDialog(b.dataset.id, [{ ws: mondayOf(dt), d: (dt.getDay() + 6) % 7 }], "출결"); break; }
    case "mprev": case "mnext": ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() + (a === "mprev" ? -1 : 1), 1); render(); break;
    case "mthis": ui.month = null; render(); break;
    case "open-day": mutate(() => { const w = ensureWeek(); w.open = w.open || []; w.open[Number(b.dataset.d)] = true; }, [wk]); break;
    case "close-day": mutate(() => { const w = ensureWeek(); w.open[Number(b.dataset.d)] = false; }, [wk]); break;
    case "copy-prev": {
      const prev = state.weeks[ymd(addDays(ui.ws, -7))] || virtualWeek(addDays(ui.ws, -7));
      if (state.weeks[wsKey()] && !(await ask("지난주 시간표를 복사할까요?", "이 주의 시간표·TO DO를 지난주 것으로 바꿔요. 학생 표, 출결, 메모는 그대로 남아요.", "복사하기"))) break;
      mutate(() => { const w = ensureWeek(); w.days = clone(prev.days); w.templateId = prev.templateId; }, [wk]);
      toast("지난주 시간표를 복사했어요"); break;
    }
    case "reset-tpl": {
      const w = curWeek(), tpl = tplById(w.templateId) || defaultTpl();
      if (!(await ask("템플릿으로 되돌릴까요?", `이 주에서 고친 시간표를 '${tpl.name}' 내용으로 되돌려요. 학생 표, 출결, 메모는 그대로 남아요.`, "되돌리기", true))) break;
      mutate(() => { const w2 = ensureWeek(); w2.templateId = tpl.id; w2.days = daysFromTemplate(tpl, weekInfo(ui.ws).n); }, [wk]); break;
    }
    case "save-as-tpl": saveAsTemplate(); break;
    case "tpl-pick": ui.tplId = b.dataset.id; saveUI(); render(); break;
    case "tpl-new": mutate(() => { const t = { id: "t_" + uid(), name: "새 템플릿", days: DAYS.map(blankDay) }; state.templates.push(t); ui.tplId = t.id; }, ["config"]); break;
    case "tpl-dup": mutate(() => { const src = tplById(ui.tplId); const t = { ...clone(src), id: "t_" + uid(), name: src.name + " 복사본" }; state.templates.push(t); ui.tplId = t.id; }, ["config"]); break;
    case "tpl-del": {
      const t = tplById(ui.tplId); if (!t || state.templates.length < 2) break;
      if (!(await ask(`'${t.name}' 템플릿을 삭제할까요?`, "이미 만든 주의 시간표는 그대로 남아요.", "삭제", true))) break;
      mutate(() => { state.templates = state.templates.filter(x => x.id !== t.id); if (state.settings.defaultTemplateId === t.id) state.settings.defaultTemplateId = state.templates[0].id; ui.tplId = state.templates[0].id; }, ["config"]); break;
    }
    case "tpl-default": mutate(() => { state.settings.defaultTemplateId = ui.tplId; }, ["config"]); toast("기본 템플릿으로 지정했어요"); break;
    case "subj-color": mutate(() => { subj(b.dataset.id).color = b.dataset.c; }, ["config"]); break;
    case "subj-up": case "subj-down": mutate(() => { const L = state.subjects, i = L.findIndex(s => s.id === b.dataset.id), j = a === "subj-up" ? i - 1 : i + 1; [L[i], L[j]] = [L[j], L[i]]; }, ["config"]); break;
    case "subj-del": {
      const s = subj(b.dataset.id);
      if (!(await ask(`'${s.name}' 과목을 삭제할까요?`, "이 과목이 들어 있던 칸은 빈칸이 돼요.", "삭제", true))) break;
      mutate(() => { state.subjects = state.subjects.filter(x => x.id !== s.id); }, ["config"]); break;
    }
    case "wkend": mutate(() => { state.settings.weekendNext = b.dataset.v === "1"; }, ["config"]); break;
    case "sem-add": mutate(() => state.settings.semesters.push({ name: "새 학기", start: "", end: "" }), ["config"]); break;
    case "sem-del": mutate(() => state.settings.semesters.splice(Number(b.dataset.i), 1), ["config"]); break;
    case "hol-add": { const t = ymd(todayKST()); mutate(() => state.settings.holidays.push({ name: "재량휴업일", start: t, end: t, vacation: false }), ["config"]); break; }
    case "hol-del": mutate(() => state.settings.holidays.splice(Number(b.dataset.i), 1), ["config"]); break;
    case "export": exportAll(); break;
    case "import-paste": importPasteDialog(); break;
    case "reset-all": {
      if (!(await ask("처음 상태로 초기화할까요?", "모든 주, 출결, 템플릿, 과목, 설정이 예시 상태로 돌아가요. 필요하면 먼저 내보내기로 백업하세요.", "초기화", true))) break;
      const oldWeeks = Object.keys(state.weeks);
      mutate(() => { state = defaultState(); }, ["config", ...oldWeeks.map(k => "w:" + k)]);
      toast("초기화했어요"); break;
    }
  }
});

function saveAsTemplate() {
  const w = curWeek(), info = weekInfo(ui.ws);
  const base = tplById(w.templateId) || defaultTpl();
  openDialog(`<h2>이 주를 템플릿으로 저장</h2>
    <label class="rows"><span class="hint">새 템플릿 이름</span><input class="field" id="nt-name" value="${esc((info.n ? info.n + "주 " : md(ui.ws) + " ") + "시간표")}" autofocus></label>
    <div class="acts"><button class="btn" data-x="over">'${esc(base.name)}'에 덮어쓰기</button><button class="btn primary" data-x="new">새 템플릿으로 저장</button></div>`,
    (dlg, close) => dlg.addEventListener("click", async e => {
      const x = e.target.closest("[data-x]"); if (!x) return;
      const days = clone(w.days).map(d => ({ ...d, cells: d.cells.map(c => ({ s: c.s, t: c.t, n: c.n, span: c.span || 1, box: !!c.box })) }));
      if (x.dataset.x === "new") {
        const name = dlg.querySelector("#nt-name").value.trim() || "새 템플릿";
        close(); mutate(() => state.templates.push({ id: "t_" + uid(), name, days }), ["config"]); toast(`'${name}' 템플릿을 만들었어요`);
      } else {
        close();
        if (!(await ask(`'${base.name}'에 덮어쓸까요?`, "홀수 주 과목 설정은 이 주에 보이는 과목으로 바뀌어요.", "덮어쓰기", true))) return;
        mutate(() => { base.days = days; }, ["config"]); toast("템플릿을 바꿨어요");
      }
    }));
}

function exportAll() {
  const data = JSON.stringify({ app: "weekly-plan", exportedAt: new Date().toISOString(), ...state }, null, 1);
  const name = `주간학습안내-백업-${ymd(todayKST())}.json`;
  if (DL) { DL.save({ filename: name, data }).then(() => toast("내보냈어요")).catch(err => { if (err && err.code !== "declined") showExportText(data); }); return; }
  if (!framed) {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast("파일로 내보냈어요"); return;
  }
  showExportText(data);
}
function showExportText(data) {
  openDialog(`<h2>백업 내용</h2><p class="hint">아래 내용을 복사해 메모장 등에 저장해 두세요. 가져올 때 그대로 붙여넣으면 돼요.</p>
    <textarea class="field" id="exp-text" readonly>${esc(data)}</textarea><div class="acts"><button class="btn primary" data-x="copy">복사</button></div>`,
    dlg => dlg.addEventListener("click", e => {
      if (!e.target.closest("[data-x=copy]")) return;
      const ta = dlg.querySelector("#exp-text");
      navigator.clipboard.writeText(data).then(() => toast("복사했어요")).catch(() => { ta.focus(); ta.select(); toast("선택했어요. 복사하세요"); });
    }));
}
function importPasteDialog() {
  openDialog(`<h2>붙여넣어 가져오기</h2><textarea class="field" id="imp-text" placeholder="내보낸 백업 내용을 붙여넣으세요" autofocus></textarea>
    <div class="acts"><button class="btn primary" data-x="go">가져오기</button></div>`,
    (dlg, close) => dlg.addEventListener("click", e => { if (e.target.closest("[data-x=go]")) { const v = dlg.querySelector("#imp-text").value; close(); importText(v); } }));
}
async function importText(text) {
  let data;
  try { data = JSON.parse(text); } catch { toast("백업 형식이 아니에요. 내보낸 파일 내용을 그대로 넣어 주세요"); return; }
  if (!data || !data.settings || !Array.isArray(data.templates) || !Array.isArray(data.subjects)) { toast("주간학습 안내 백업이 아니에요"); return; }
  if (!(await ask("백업을 가져올까요?", "지금 내용이 백업 내용으로 바뀌어요.", "가져오기", true))) return;
  const oldWeeks = Object.keys(state.weeks);
  mutate(() => { state = { v: data.v || 1, settings: data.settings, subjects: data.subjects, templates: data.templates, weeks: data.weeks || {} }; migrate(state); },
    ["config", ...new Set([...oldWeeks, ...Object.keys(data.weeks || {})].map(k => "w:" + k))]);
  toast("가져왔어요");
}

let lastNarrow = isNarrow();
window.addEventListener("resize", () => { const n = isNarrow(); if (n !== lastNarrow) { lastNarrow = n; if (!document.activeElement || !document.activeElement.closest(".ed")) render(); } });
window.addEventListener("beforeprint", () => { if (useCards()) { const v = ui.view; ui.view = "table"; render(); ui.view = v; } });
window.addEventListener("afterprint", () => render());

render();
connectCloud();
})();
</script>
